    --secondary-container: #6cf8bb;
    --on-secondary-container: #00714d;
    --tertiary: #924700;
    --tertiary-container: #b75b00;
    --tertiary-fixed: #ffdcc6;
    --on-tertiary-fixed: #311400;
    --error: #ba1a1a;
    --error-container: #ffdad6;
    --on-surface: #191c1e;
    --on-surface-variant: #424754;
    --outline: #727785;
    --outline-variant: #c2c6d6;
    --inverse-surface: #2d3133;
    --inverse-on-surface: #eff1f3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
  }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    display: inline-block;
    line-height: 1;
    text-transform: none;
    letter-spacing: normal;
    word-wrap: normal;
    white-space: nowrap;
    direction: ltr;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  /* ============================================
     HEADER
     ============================================ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    min-height: 48px;
    flex-shrink: 0;
  }

  .header .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }

  .header .header-icon {
    color: var(--primary);
    font-size: 24px;
  }

  .header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--on-surface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .header h1.tappable-title {
    cursor: pointer;
    padding: 4px 6px;
    margin: -4px -6px;
    border-radius: 6px;
    transition: background 0.15s;
  }

  .header h1.tappable-title:active {
    background: var(--surface-container-low);
  }

  .header .conn-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 9999px;
    background: var(--surface-container-low);
  }

  .header .conn-pill .conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .header .conn-pill .conn-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
  }

  .header .back-btn {
    background: none;
    border: none;
    color: var(--primary);
    padding: 6px;
    margin-left: -6px;
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .header .back-btn:active {
    background: var(--surface-container-low);
    transform: scale(0.95);
  }

  .header .detail-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* ============================================
     SESSION LIST
     ============================================ */
  .session-list-view {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
  }

  .session-list-view.hidden { display: none; }

  .session-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 20px 24px;
  }

  .section-header {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--on-surface-variant);
    padding: 16px 0 10px;
  }

  .section-header.skipped-header {
    opacity: 0.6;
  }

  .session-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface-container-lowest);
    border-radius: 0.5rem;
    cursor: pointer;
    transition: transform 0.15s;
    margin-bottom: 10px;
  }

  .session-item:active {
    transform: scale(0.98);
  }

  .session-item .emoji-box {
    width: 48px;
    height: 48px;
    border-radius: 0.5rem;
    background: var(--surface-container-low);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .session-item .info {
    flex: 1;
    min-width: 0;
  }

  .session-item .name-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .session-item .name {
    font-size: 14px;
    font-weight: 700;
    color: var(--on-surface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  .session-item .status-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .session-item .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .session-item .status-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .session-item .meta {
    display: flex;
    gap: 12px;
    margin-top: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
  }

  /* Skipped session styling */
  .session-item.skipped {
    background: var(--surface-container-high);
    color: var(--on-surface-variant);
  }

  .session-item.skipped .emoji-box {
    width: 40px;
    height: 40px;
    font-size: 18px;
    background: var(--surface-container-highest);
  }

  /* ============================================
     SIDEBAR MODE (?sidebar=1) — the iTerm2 Toolbelt panel
     One row per CONVERSATION (not per session), blocked ones first: at panel
     width the only question worth answering instantly is "who needs me".
     Phone-only chrome (tabs, FAB, stats button) is hidden.
     ============================================ */
  body.sidebar .list-tabs,
  body.sidebar .fab,
  body.sidebar .hdr-btn,
  body.sidebar .conn-label { display: none; }

  body.sidebar .header { padding: 8px 10px; min-height: 34px; }
  body.sidebar .header h1 { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; }
  body.sidebar .header .header-icon { font-size: 17px; }
  body.sidebar .session-list { padding: 4px 8px 16px; }

  body.sidebar .sb-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    border-left: 3px solid transparent;
    border-radius: 6px;
    background: var(--surface-container-lowest);
    margin-bottom: 4px;
    cursor: pointer;
  }
  body.sidebar .sb-row:hover { background: var(--surface-container); }
  body.sidebar .sb-row:active { transform: scale(0.985); }
  /* where the attached tmux client is looking right now */
  body.sidebar .sb-row.current {
    border-left-color: var(--primary);
    background: var(--primary-fixed);
  }
  body.sidebar .sb-row.current .sb-title { font-weight: 800; color: var(--on-primary-fixed); }

  /* One group per tmux session — which is one project, or one worktree. */
  body.sidebar .sb-group { margin-bottom: 10px; }
  body.sidebar .sb-group-head {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--on-surface-variant);
    padding: 2px 2px 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.sidebar .sb-group-emoji { font-size: 12px; }

  /* A worktree inside its project: indented under the project header, with a
     rule down the left so a long tail still reads as "belonging to" above. */
  body.sidebar .sb-wt {
    margin-left: 7px; padding-left: 7px;
    border-left: 1px solid var(--outline-variant);
  }
  body.sidebar .sb-wt-head {
    font-size: 10px; font-weight: 700; color: var(--on-surface-variant);
    padding: 3px 2px 4px; opacity: 0.85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* blocked — the one state that should catch your eye from across the room */
  body.sidebar .sb-row.need {
    border-left-color: var(--tertiary-container);
    background: var(--tertiary-fixed);
  }
  body.sidebar .sb-row.skip { background: var(--surface-container-high); opacity: 0.7; }
  body.sidebar .sb-row.frozen { background: var(--surface-container-low); }

  body.sidebar .sb-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  body.sidebar .sb-dot.frozen-dot {
    width: auto; height: auto; border-radius: 0;
    font-size: 11px; background: none !important;
  }
  /* The title is the only thing that gives: age and state keep their width so
     the right-hand columns stay aligned down the whole panel. */
  body.sidebar .sb-title {
    flex: 1; min-width: 0;
    font-size: 12px; font-weight: 600; color: var(--on-surface);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.sidebar .sb-age {
    flex-shrink: 0; font-size: 10px; color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums; text-align: right; min-width: 22px;
  }
  body.sidebar .sb-state {
    font-size: 9px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; flex-shrink: 0;
    text-align: right; min-width: 30px;
  }

  body.sidebar .sb-sect-head {
    display: flex; align-items: center; gap: 1px;
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--on-surface-variant);
    padding: 12px 2px 6px; cursor: pointer; user-select: none;
  }
  body.sidebar .sb-caret { font-size: 14px; transition: transform 0.15s; }
  body.sidebar .sb-sect.open .sb-caret { transform: rotate(90deg); }
  body.sidebar .sb-sect-body { display: none; }
  body.sidebar .sb-sect.open .sb-sect-body { display: block; }
  body.sidebar .sb-empty {
    font-size: 11px; color: var(--on-surface-variant);
    padding: 16px 4px; text-align: center;
  }

  /* ============================================
     DETAIL VIEW
     ============================================ */
  .detail-view {
    display: none;
    flex-direction: column;
    height: 100%;
    background: var(--surface);
    z-index: 10;
    overflow: hidden;
    position: relative;
  }

  .detail-view.active { display: flex; }

  .detail-status {
    padding: 0 20px 10px;
    flex-shrink: 0;
  }

  .detail-status .badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 9999px;
  }

  .badge .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  .badge.idle {
    background: var(--secondary-container);
    color: var(--on-secondary-container);
  }
  .badge.idle .badge-dot { background: var(--secondary); }

  .badge.busy {
    background: var(--error-container);
    color: var(--on-error-container);
  }
  .badge.busy .badge-dot { background: var(--error); }

  .badge.attention {
    background: var(--tertiary-fixed);
    color: var(--on-tertiary-fixed);
  }
  .badge.attention .badge-dot { background: var(--tertiary-container); }

  .badge.cpu {
    background: var(--surface-container-high);
    color: var(--on-surface-variant);
  }

  /* ============================================
     CHAT AREA
     ============================================ */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .chat-msg {
    max-width: 90%;
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .chat-msg.assistant {
    align-self: flex-start;
  }

  .chat-msg.assistant .msg-bubble {
    background: var(--surface-container-lowest);
    border: 1px solid rgba(194, 198, 214, 0.15);
    border-radius: 16px;
    border-top-left-radius: 4px;
    padding: 14px 18px;
    color: var(--on-surface-variant);
  }

  .chat-msg.user {
    align-self: flex-end;
  }

  .chat-msg.user .msg-bubble {
    background: var(--primary-fixed);
    color: var(--on-primary-fixed);
    border-radius: 16px;
    border-top-right-radius: 4px;
    padding: 12px 16px;
  }

  .chat-msg .role-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    color: var(--on-surface-variant);
  }

  .chat-msg.user .role-label {
    color: rgba(0, 26, 66, 0.5);
    text-align: right;
  }

  /* Workflow cards. A background launch and its completion are the two ends of one
     thing that can be hours apart in the scroll, so they share a look: the launch and
     the running card sit where they belong chronologically, and the completion lands
     where the notification actually arrived. Full width — these are reports, not
     something anyone said, so they don't belong in either speech lane. */
  .chat-msg.workflow, .chat-msg.report { align-self: stretch; max-width: 100%; }
  .wf-card {
    border: 1px solid rgba(194, 198, 214, 0.28);
    border-radius: 12px;
    background: var(--surface-container-lowest);
    padding: 12px 14px;
  }
  .wf-card.running {
    background: color-mix(in srgb, var(--primary) 7%, var(--surface-container-lowest));
    border-color: color-mix(in srgb, var(--primary) 38%, transparent);
  }
  .wf-card.failed {
    background: color-mix(in srgb, var(--error) 7%, var(--surface-container-lowest));
    border-color: color-mix(in srgb, var(--error) 38%, transparent);
  }
  .wf-head { display: flex; align-items: center; gap: 8px; }
  .wf-name { font-weight: 700; font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-elapsed { font-size: 11px; font-weight: 600; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
  .wf-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none;
    animation: wf-pulse 1.6s ease-in-out infinite;
  }
  @keyframes wf-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .wf-pill {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 8px; border-radius: 999px; flex: none;
    background: color-mix(in srgb, var(--secondary) 18%, transparent); color: var(--secondary);
  }
  .wf-pill.failed, .wf-pill.killed { background: color-mix(in srgb, var(--error) 15%, transparent); color: var(--error); }
  /* A workflow reports "completed" with dead agents inside it — the one thing in the
     usage block with no other surface anywhere in hive. */
  .wf-warn {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; flex: none;
    background: color-mix(in srgb, var(--error) 14%, transparent); color: var(--error);
  }
  .wf-desc { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 6px; line-height: 1.45; }
  .wf-stats { font-size: 11.5px; color: var(--on-surface-variant); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .wf-phases { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .wf-phase {
    font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
    background: var(--surface-container); color: var(--on-surface-variant);
  }
  .wf-actions { display: flex; gap: 8px; margin-top: 10px; }
  .wf-btn {
    flex: 1; padding: 7px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(194, 198, 214, 0.35); background: var(--surface-container-lowest);
    color: var(--primary); font-size: 12px; font-weight: 600;
  }
  .wf-result h2 { font-size: 14px; margin: 14px 0 6px; }
  .wf-result h2:first-child { margin-top: 0; }
  .wf-result .wf-key {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--primary); margin: 16px 0 6px;
  }
  .wf-result .wf-key:first-child { margin-top: 0; }

  .chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    justify-content: center;
    color: var(--outline);
    font-size: 14px;
  }

  .jump-bottom {
    position: absolute;
    bottom: 16px;
    right: 24px;
    z-index: 5;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-container-lowest);
    border: 1px solid var(--outline-variant);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--on-surface-variant);
    transition: opacity 0.15s, transform 0.15s;
  }

  .jump-bottom:active { transform: scale(0.9); }
  .jump-bottom.hidden { display: none; }

  /* Markdown styles inside assistant messages */
  .chat-msg h1, .chat-msg h2, .chat-msg h3 {
    margin: 10px 0 4px 0;
    line-height: 1.3;
    color: var(--on-surface);
    font-weight: 700;
  }
  .chat-msg h1 { font-size: 17px; }
  .chat-msg h2 { font-size: 15px; }
  .chat-msg h3 { font-size: 14px; }
  .chat-msg h1:first-child, .chat-msg h2:first-child, .chat-msg h3:first-child {
    margin-top: 0;
  }

  .chat-msg p { margin: 6px 0; }
  .chat-msg p:first-child { margin-top: 0; }
  .chat-msg p:last-child { margin-bottom: 0; }

  .chat-msg code {
    background: var(--surface-container);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 12.5px;
    color: var(--primary);
  }

  .chat-msg pre {
    background: var(--inverse-surface) !important;
    color: var(--inverse-on-surface);
    border-radius: 0.5rem;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12px;
    line-height: 1.5;
  }

  /* Prism overrides for dark code blocks */
  .chat-msg pre code[class*="language-"],
  .chat-msg pre[class*="language-"] {
    background: var(--inverse-surface) !important;
    color: var(--inverse-on-surface) !important;
    text-shadow: none !important;
  }

  .chat-msg .token.comment { color: #8b949e; }
  .chat-msg .token.string { color: #a5d6ff; }
  .chat-msg .token.keyword { color: #ff7b72; }
  .chat-msg .token.function { color: #d2a8ff; }
  .chat-msg .token.number { color: #79c0ff; }
  .chat-msg .token.operator { color: #ff7b72; }
  .chat-msg .token.punctuation { color: #c9d1d9; }
  .chat-msg .token.property { color: #79c0ff; }
  .chat-msg .token.boolean { color: #79c0ff; }
  .chat-msg .token.class-name { color: #ffa657; }

  .chat-msg pre code {
    background: none;
    padding: 0;
    border-radius: 0;
    font-size: inherit;
    color: inherit;
  }

  .chat-msg ul, .chat-msg ol {
    margin: 6px 0;
    padding-left: 20px;
  }

  .chat-msg li { margin: 2px 0; }

  .chat-msg strong { font-weight: 700; color: var(--on-surface); }
  .chat-msg em { font-style: italic; }

  .chat-msg a {
    color: var(--primary);
    text-decoration: none;
  }

  .chat-msg blockquote {
    border-left: 3px solid var(--outline-variant);
    padding-left: 12px;
    margin: 6px 0;
    color: var(--on-surface-variant);
  }

  .md-table-wrap {
    overflow-x: auto;
    margin: 8px 0;
    -webkit-overflow-scrolling: touch;
  }

  .chat-msg table {
    border-collapse: collapse;
    font-size: 12px;
    width: 100%;
    min-width: max-content;
  }

  .chat-msg th, .chat-msg td {
    padding: 6px 10px;
    text-align: left;
    white-space: nowrap;
  }

  .chat-msg th {
    background: var(--surface-container-high);
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--on-surface-variant);
  }

  .chat-msg td {
    background: var(--surface-container-low);
    color: var(--on-surface);
  }

  .chat-msg tr:nth-child(even) td {
    background: var(--surface-container);
  }

  .chat-msg hr {
    border: none;
    border-top: 1px solid var(--outline-variant);
    margin: 10px 0;
  }

  /* ============================================
     TOOL CARDS
     ============================================ */
  .tool-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-container-low);
    border: 1px solid rgba(194, 198, 214, 0.2);
    border-radius: 16px;
    border-top-left-radius: 4px;
    padding: 10px 12px;
    margin: 6px 0;
    cursor: pointer;
    transition: transform 0.15s;
    font-size: 13px;
  }

  .tool-card:active { transform: scale(0.97); }

  .tool-card .tool-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-container-lowest);
  }

  .tool-card .tool-icon .material-symbols-outlined {
    font-size: 20px;
  }

  .tool-icon.bash { color: var(--primary); }
  .tool-icon.write { color: var(--secondary); }
  .tool-icon.edit { color: var(--tertiary); }
  .tool-icon.read { color: var(--primary); }
  .tool-icon.grep { color: var(--outline); }
  .tool-icon.agent { color: var(--error); }
  .tool-icon.other { color: var(--on-surface-variant); }

  .tool-card .tool-info { flex: 1; min-width: 0; }

  .tool-card .tool-name {
    font-weight: 700;
    font-size: 12px;
    color: var(--on-surface);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .tool-card .tool-summary {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--on-surface-variant);
    font-size: 12px;
    margin-top: 1px;
  }

  .tool-card .tool-chevron {
    color: var(--on-surface-variant);
    flex-shrink: 0;
    font-size: 18px;
  }

  /* ============================================
     MODAL OVERLAY (Bottom Sheet)
     ============================================ */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(25, 28, 30, 0.4);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-sheet {
    background: var(--surface-container-lowest);
    border-radius: 2rem 2rem 0 0;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    display: flex;
    justify-content: center;
    padding-top: 12px;
    padding-bottom: 8px;
  }

  .modal-handle-bar {
    width: 48px;
    height: 5px;
    border-radius: 9999px;
    background: rgba(194, 198, 214, 0.3);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 16px;
    flex-shrink: 0;
  }

  .modal-header .modal-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--on-surface);
  }

  .modal-header .modal-close {
    background: none;
    border: none;
    color: var(--on-surface-variant);
    padding: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.15s;
  }

  .modal-header .modal-close:hover {
    background: var(--surface-container-low);
  }

  .modal-body {
    padding: 0 20px 24px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
  }

  /* Tool section header (icon + label) */
  .tool-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px;
    margin-bottom: 12px;
  }

  .tool-section-icon {
    width: 32px; height: 32px;
    border-radius: 0.5rem;
    background: var(--surface-container);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--on-surface-variant);
  }

  .tool-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--on-surface-variant);
  }

  /* Terminal code block */
  .terminal-block {
    background: #1e1e1e;
    padding: 16px 20px;
    border-radius: 0.75rem;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #93c5fd;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .terminal-block .prompt { color: #4ade80; }

  .terminal-block .copy-btn {
    position: absolute;
    top: 10px; right: 10px;
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.1);
    border: none; color: rgba(255,255,255,0.7);
    font-size: 10px; font-weight: 500;
    padding: 4px 8px; border-radius: 6px;
    cursor: pointer; backdrop-filter: blur(8px);
  }

  .terminal-block .copy-btn:active { background: rgba(255,255,255,0.25); }

  /* File viewer (Edit/Write) */
  .file-viewer {
    border-radius: 0.75rem;
    overflow: hidden;
    border: 1px solid rgba(194, 198, 214, 0.2);
  }

  .file-viewer-header {
    padding: 8px 14px;
    background: var(--surface-container-high);
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--on-surface-variant);
    font-family: 'SF Mono', 'Menlo', monospace;
  }

  .file-viewer-header .material-symbols-outlined { font-size: 16px; }

  .file-viewer-body {
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 12px;
    line-height: 1.8;
    padding: 0;
  }

  .diff-line {
    display: flex;
    padding: 0 12px;
  }

  .diff-line .line-no {
    width: 36px;
    text-align: right;
    padding-right: 12px;
    color: var(--outline-variant);
    user-select: none;
    flex-shrink: 0;
  }

  .diff-line .line-no {
    color: var(--outline-variant);
  }

  .diff-line.del {
    background: rgba(186, 26, 26, 0.08);
    color: var(--error);
    border-left: 2px solid var(--error);
  }

  .diff-line.del .line-no { color: rgba(186, 26, 26, 0.5); }

  .diff-line.add {
    background: rgba(0, 108, 73, 0.08);
    color: var(--secondary);
    border-left: 2px solid var(--secondary);
  }

  .diff-line.add .line-no { color: rgba(0, 108, 73, 0.5); }

  .write-body {
    padding: 14px 16px;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 12px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--on-surface);
  }

  /* Generic fallback */
  .modal-body pre {
    background: var(--inverse-surface);
    color: var(--inverse-on-surface);
    border-radius: 0.75rem;
    padding: 14px 16px;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-x: auto;
  }

  /* ============================================
     TTS BAR
     ============================================ */
  .tts-bar {
    display: none;
    padding: 8px 16px 0;
    justify-content: center;
  }

  .tts-bar.visible { display: flex; }

  .tts-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(194, 198, 214, 0.15);
    border-radius: 9999px;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 16px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    transition: transform 0.15s;
  }

  .tts-btn:active { transform: scale(0.95); }
  .tts-btn.busy-state {
    background: var(--surface-container-high);
    color: var(--on-surface-variant);
    border-color: transparent;
  }

  .tts-btn .tts-icon {
    font-size: 18px;
  }

  @keyframes tts-pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .tts-btn.loading .tts-label {
    animation: tts-pulse 1s ease-in-out infinite;
  }

  /* ============================================
     BOTTOM BAR
     ============================================ */
  .bottom-bar {
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(24px);
    border-top: 1px solid rgba(194, 198, 214, 0.15);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03);
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  .bottom-bar.collapsed {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
    margin: 0;
    padding: 0;
    max-height: 0;
    overflow: hidden;
  }

  .quick-actions {
    display: flex;
    gap: 8px;
    padding: 10px 16px 0;
    flex-wrap: wrap;
  }

  .quick-actions.hidden { display: none; }

  .quick-btn {
    background: var(--surface-container-lowest);
    border: 1px solid rgba(0, 88, 190, 0.15);
    border-radius: 9999px;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .quick-btn:active { transform: scale(0.95); }

  .quick-btn.reject {
    border-color: rgba(186, 26, 26, 0.15);
    color: var(--error);
  }

  .quick-btn.neutral {
    border-color: var(--outline-variant);
    color: var(--on-surface-variant);
  }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    align-items: flex-end;
  }

  .input-bar .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface-container-low);
    border-radius: 16px;
    padding: 0 16px;
    transition: box-shadow 0.2s;
  }

  .input-bar .input-wrap:focus-within {
    box-shadow: 0 0 0 2px rgba(0, 88, 190, 0.15);
  }

  .input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 12px 0;
    color: var(--on-surface);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }

  .input-bar input::placeholder {
    color: var(--outline);
  }

  .input-bar .send-btn {
    background: var(--primary);
    border: none;
    border-radius: 0.75rem;
    color: white;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s;
    box-shadow: 0 2px 8px rgba(0, 88, 190, 0.25);
  }

  .input-bar .send-btn:active { transform: scale(0.9); }
  .input-bar .send-btn:disabled { opacity: 0.4; }

  .input-bar .send-btn .material-symbols-outlined {
    font-size: 20px;
  }

  /* ============================================
     LOADING
     ============================================ */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--outline);
    font-size: 14px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .loading .dot-pulse { animation: pulse 1.5s ease-in-out infinite; }

  /* ============================================
     SWIPE TO SKIP
     ============================================ */
  .session-item-wrapper {
    position: relative;
    overflow: hidden;
    border-radius: 0.5rem;
    margin-bottom: 10px;
  }

  .swipe-action {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 24px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: white;
    border-radius: 0.5rem;
  }

  .swipe-action.skip-action {
    background: var(--error);
  }

  .swipe-action.unskip-action {
    background: var(--secondary);
  }

  .session-item-wrapper .session-item {
    position: relative;
    z-index: 1;
    will-change: transform;
    transition: none;
    margin-bottom: 0;
  }

  .session-item-wrapper .session-item.swipe-animating {
    transition: transform 0.25s ease;
  }

  /* Accordion (multi-window sessions) */
  .session-item .window-count {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--on-surface-variant);
  }
  .session-item .chevron {
    font-size: 20px;
    color: var(--on-surface-variant);
    transition: transform 0.2s ease;
    margin-left: 2px;
  }
  .session-item-wrapper.expanded .chevron {
    transform: rotate(180deg);
  }
  .accordion-windows {
    display: none;
    position: relative;
    z-index: 1;
    padding: 4px 8px 8px 8px;
    background: var(--surface-container, rgba(0,0,0,0.02));
    border-radius: 0 0 0.5rem 0.5rem;
  }
  .session-item-wrapper.expanded .accordion-windows {
    display: block;
  }
  .window-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-top: 6px;
    border-radius: 0.5rem;
    background: var(--surface, #fff);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    cursor: pointer;
  }
  .window-item:active {
    background: var(--surface-variant, #eee);
  }
  .window-item .w-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .window-item .w-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: var(--on-surface);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .window-item .w-status {
    font-size: 11px;
    font-weight: 700;
  }
  .window-item .w-meta {
    font-size: 10px;
    color: var(--on-surface-variant);
    font-weight: 600;
  }

  /* ============================================
     TODO COUNT BADGE
     ============================================ */
  .todo-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 700;
    color: var(--on-surface-variant);
    background: var(--surface-container-high);
    padding: 2px 7px;
    border-radius: 9999px;
    letter-spacing: 0.03em;
  }

  .todo-badge .material-symbols-outlined {
    font-size: 13px;
  }

  /* ============================================
     FLOATING ACTION BUTTON
     ============================================ */
  .fab {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-container));
    color: white;
    border: none;
    box-shadow: 0 4px 16px rgba(0, 88, 190, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.9); }
  .fab .material-symbols-outlined { font-size: 28px; }

  /* ============================================
     PICKER MODAL (full-screen)
     ============================================ */
  .picker-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--surface);
    z-index: 200;
    flex-direction: column;
  }

  .picker-overlay.active { display: flex; }

  .picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    min-height: 56px;
    flex-shrink: 0;
  }

  .picker-header .picker-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--on-surface);
  }

  .picker-header .picker-close {
    background: none;
    border: none;
    color: var(--on-surface-variant);
    padding: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.15s;
  }

  .picker-header .picker-close:active {
    background: var(--surface-container-low);
  }

  .picker-search {
    padding: 0 20px 12px;
    flex-shrink: 0;
  }

  .picker-search input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface-container-low);
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--on-surface);
    outline: none;
  }

  .picker-search input::placeholder {
    color: var(--outline);
  }

  .picker-search input:focus {
    box-shadow: 0 0 0 2px rgba(0, 88, 190, 0.15);
  }

  .picker-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 20px 24px;
  }

  .picker-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface-container-lowest);
    border-radius: 0.5rem;
    cursor: pointer;
    transition: transform 0.15s;
    margin-bottom: 10px;
  }

  .picker-item:active { transform: scale(0.98); }

  .picker-item .picker-emoji {
    width: 48px;
    height: 48px;
    border-radius: 0.5rem;
    background: var(--surface-container-low);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .picker-item .picker-info {
    flex: 1;
    min-width: 0;
  }

  .picker-item .picker-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--on-surface);
  }

  .picker-item .picker-status {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 3px;
  }

  .picker-item .picker-status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .picker-item .picker-status-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--on-surface-variant);
  }

  /* ============================================
     SESSION INFO MODAL (Bottom Sheet)
     ============================================ */
  .info-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(25, 28, 30, 0.4);
    backdrop-filter: blur(4px);
    z-index: 150;
    align-items: flex-end;
    justify-content: center;
  }

  .info-overlay.active { display: flex; }

  /* Usage/stats view */
  .stats-tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    background: var(--surface-container); border-radius: 10px; padding: 4px;
  }
  .stats-tab {
    flex: 1; border: none; background: none; cursor: pointer;
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
    color: #5b6168;
  }
  .stats-tab.active { background: var(--surface-container-lowest); color: var(--primary); }
  .stats-pane.hidden { display: none; }
  .stats-note { font-size: 12px; color: #5b6168; margin-top: 4px; line-height: 1.4; }

  /* Active/Resume segmented toggle at the top of the session list */
  .list-tabs {
    display: flex; gap: 6px; margin: 12px 16px 2px;
    background: var(--surface-container); border-radius: 10px; padding: 4px;
  }
  .list-tab {
    flex: 1; border: none; background: none; cursor: pointer;
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
    color: #5b6168;
  }
  .list-tab.active { background: var(--surface-container-lowest); color: var(--primary); }
  /* Offline banner: the list keeps rendering its last good data when polls fail, so
     without this the page looks live while showing minutes-old state. */
  .offline-banner {
    margin: 8px 16px 0; padding: 10px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--error) 12%, var(--surface-container-lowest));
    border: 1px solid color-mix(in srgb, var(--error) 35%, transparent);
    color: var(--error); font-size: 12.5px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .offline-banner[hidden] { display: none; }
  .offline-banner .material-symbols-outlined { font-size: 18px; }
  .offline-banner .stale { font-weight: 500; opacity: 0.8; }
  /* Retry affordance for a list that has nothing to show because the fetch failed. */
  .retry-load { text-align: center; padding: 28px 16px; color: var(--on-surface-variant); font-size: 13px; }
  .retry-load button {
    display: block; margin: 10px auto 0; padding: 8px 18px; border-radius: 8px;
    border: 1px solid var(--outline-variant, #d8dce0); background: var(--surface-container-lowest);
    color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  /* Resume (closed/resumable) conversation rows */
  .resume-item .resume-time { font-size: 11px; color: var(--on-surface-variant); font-weight: 600; white-space: nowrap; }
  .resume-item .resume-icon { color: var(--primary); font-size: 26px; align-self: center; margin-left: 4px; }
  .resume-item .mono { font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.55; }
  .conv-profile { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--tertiary); background: var(--surface-container); padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .hdr-btn {
    background: none; border: none; padding: 4px; cursor: pointer;
    color: var(--primary); display: flex; align-items: center;
  }
  .hdr-btn .material-symbols-outlined { font-size: 24px; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
  }
  .stat-cell {
    background: var(--surface-container-low); border-radius: 12px;
    padding: 12px 8px; text-align: center;
  }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--primary); line-height: 1.1; }
  .stat-label { font-size: 11px; color: #5b6168; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .stats-section-title { font-size: 13px; font-weight: 600; color: #3a4046; margin: 4px 0 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .bar-row .bar-day { width: 78px; color: #5b6168; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--surface-container-high); border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--primary-container); height: 100%; border-radius: 6px; min-width: 2px; }
