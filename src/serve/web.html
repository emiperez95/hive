<script>
let sessions = [];
let frozenList = []; // frozen Claude windows (from /api/frozen)
let conversations = []; // closed/resumable conversations (from /api/conversations)
let conversationsLoaded = false;
let conversationsFailed = false; // last fetch threw and we have nothing to show
let listTab = 'active'; // 'active' (live sessions) | 'resume' (closed conversations)
let selectedSession = null;
let selectedWindow = null; // pane id (e.g. "%1") when a specific window is selected
let expandedSessions = new Set(); // session names whose accordion is open
let currentMessages = [];
let pollTimer = null;
let msgPollTimer = null;
let wasAtBottom = true;

// Sidebar mode: the same data, rendered as a narrow always-visible column for
// the iTerm2 Toolbelt panel. Opt in with ?sidebar=1 so the phone dashboard at
// "/" is untouched.
const SIDEBAR = new URLSearchParams(location.search).has('sidebar');
if (SIDEBAR) document.body.classList.add('sidebar');
// Skipped and frozen start folded — they're reference, not attention.
let sbCollapsed = { skipped: true, frozen: true };
let currentFocus = {};      // {session, window_index} of the attached tmux client
let lastFocusJson = '';

// --- Markdown renderer ---
function renderTable(tableLines) {
  const parseRow = line => line.split('|').slice(1, -1).map(c => c.trim());
  const headers = parseRow(tableLines[0]);
  // Skip separator row (row 1 with dashes)
  const startRow = (tableLines.length > 1 && /^[\s|:-]+$/.test(tableLines[1])) ? 2 : 1;
  let html = '<div class="md-table-wrap"><table><thead><tr>';
  headers.forEach(h => { html += '<th>' + inlineMarkdown(h) + '</th>'; });
  html += '</tr></thead><tbody>';
  for (let r = startRow; r < tableLines.length; r++) {
    const cells = parseRow(tableLines[r]);
    html += '<tr>';
    cells.forEach(c => { html += '<td>' + inlineMarkdown(c) + '</td>'; });
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderMarkdown(src) {
  // Normalize line endings
  src = src.replace(/\r\n/g, '\n');

  // Extract fenced code blocks first to protect them
  const codeBlocks = [];
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const langClass = lang ? ' class="language-' + lang + '"' : '';
    codeBlocks.push('<pre><code' + langClass + '>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '\x00CB' + (codeBlocks.length - 1) + '\x00';
  });

  // Process blocks
  const lines = src.split('\n');
  let html = '';
  let i = 0;
  let inList = false;
  let listType = '';

  function closePendingList() {
    if (inList) {
      html += listType === 'ul' ? '</ul>' : '</ol>';
      inList = false;
    }
  }

  while (i < lines.length) {
    const line = lines[i];

    // Code block placeholder
    const cbMatch = line.match(/^\x00CB(\d+)\x00$/);
    if (cbMatch) {
      closePendingList();
      html += codeBlocks[parseInt(cbMatch[1])];
      i++; continue;
    }

    // Headings
    const hMatch = line.match(/^(#{1,3})\s+(.+)/);
    if (hMatch) {
      closePendingList();
      const level = hMatch[1].length;
      html += `<h${level}>${inlineMarkdown(hMatch[2])}</h${level}>`;
      i++; continue;
    }

    // Horizontal rule
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      closePendingList();
      html += '<hr>';
      i++; continue;
    }

    // Blockquote
    if (line.startsWith('> ')) {
      closePendingList();
      let quote = '';
      while (i < lines.length && lines[i].startsWith('> ')) {
        quote += lines[i].slice(2) + '\n';
        i++;
      }
      html += '<blockquote>' + renderMarkdown(quote.trim()) + '</blockquote>';
      continue;
    }

    // Table
    if (line.includes('|') && line.trim().startsWith('|')) {
      closePendingList();
      const tableLines = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim().startsWith('|')) {
        tableLines.push(lines[i]);
        i++;
      }
      if (tableLines.length >= 2) {
        html += renderTable(tableLines);
      }
      continue;
    }

    // Unordered list
    const ulMatch = line.match(/^(\s*)[*\-+]\s+(.*)/);
    if (ulMatch) {
      if (!inList || listType !== 'ul') {
        closePendingList();
        html += '<ul>';
        inList = true; listType = 'ul';
      }
      html += '<li>' + inlineMarkdown(ulMatch[2]) + '</li>';
      i++; continue;
    }

    // Ordered list
    const olMatch = line.match(/^(\s*)\d+\.\s+(.*)/);
    if (olMatch) {
      if (!inList || listType !== 'ol') {
        closePendingList();
        html += '<ol>';
        inList = true; listType = 'ol';
      }
      html += '<li>' + inlineMarkdown(olMatch[2]) + '</li>';
      i++; continue;
    }

    // Close list if we hit a non-list line
    closePendingList();

    // Empty line
    if (line.trim() === '') {
      i++; continue;
    }

    // Paragraph — collect consecutive non-empty lines
    let para = '';
    while (i < lines.length && lines[i].trim() !== '' &&
           !lines[i].match(/^#{1,3}\s/) &&
           !lines[i].match(/^[*\-+]\s/) &&
           !lines[i].match(/^\d+\.\s/) &&
           !lines[i].startsWith('> ') &&
           !lines[i].match(/^\x00CB/) &&
           !lines[i].match(/^(-{3,}|\*{3,}|_{3,})\s*$/) &&
           !(lines[i].includes('|') && lines[i].trim().startsWith('|'))) {
      if (para) para += '\n';
      para += lines[i];
      i++;
    }
    html += '<p>' + inlineMarkdown(para) + '</p>';
  }

  closePendingList();
  return html;
}

function inlineMarkdown(text) {
  // Inline code (must come first to protect contents)
  const codes = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => {
    codes.push('<code>' + esc(code) + '</code>');
    return '\x00IC' + (codes.length - 1) + '\x00';
  });

  // Escape HTML in remaining text
  text = esc(text);

  // Bold + italic
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/_(.+?)_/g, '<em>$1</em>');
  // Strikethrough
  text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Line breaks
  text = text.replace(/\n/g, '<br>');

  // Restore inline code
  text = text.replace(/\x00IC(\d+)\x00/g, (_, idx) => codes[parseInt(idx)]);

  return text;
}

// --- Tool rendering ---
function toolIconName(name) {
  const n = name.toLowerCase();
  if (n === 'bash' || n === 'task') return 'terminal';
  if (n === 'write') return 'edit_note';
  if (n === 'edit') return 'edit';
  if (n === 'read') return 'menu_book';
  if (n === 'grep' || n === 'glob') return 'search';
  if (n === 'agent') return 'smart_toy';
  return 'build';
}

function toolIconClass(name) {
  const n = name.toLowerCase();
  if (n === 'bash' || n === 'task') return 'bash';
  if (n === 'write') return 'write';
  if (n === 'edit') return 'edit';
  if (n === 'read') return 'read';
  if (n === 'grep' || n === 'glob') return 'grep';
  if (n === 'agent') return 'agent';
  return 'other';
}

// Store tool details in a map keyed by unique ID (avoids inline onclick escaping issues)
const toolDetailStore = {};

function renderToolCards(tools) {
  if (!tools || !tools.length) return '';
  return tools.map((t) => {
    const id = 'td_' + Math.random().toString(36).slice(2, 10);
    toolDetailStore[id] = { name: t.name, detail: t.detail };
    // A Workflow launch names the workflow and lists the plan it's about to run.
    // Same card + click delegation as any tool, so tapping still opens the detail —
    // which for a workflow is the script rather than the input JSON.
    const phases = t.workflow && t.workflow.phases && t.workflow.phases.length
      ? `<div class="wf-phases">${t.workflow.phases.map(p => `<span class="wf-phase">${esc(p.title)}</span>`).join('')}</div>`
      : '';
    const title = t.workflow ? `Workflow · ${esc(t.workflow.name)}` : esc(t.name);
    return `<div class="tool-card" data-tool-id="${id}">
      <div class="tool-icon ${toolIconClass(t.name)}"><span class="material-symbols-outlined">${toolIconName(t.name)}</span></div>
      <div class="tool-info">
        <div class="tool-name">${title}</div>
        <div class="tool-summary">${esc(t.summary)}</div>
        ${phases}
      </div>
      <span class="material-symbols-outlined tool-chevron">chevron_right</span>
    </div>`;
  }).join('');
}

// --- Workflow / background-task cards ---
const wfResultStore = {};

function wfDuration(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  return h + 'h' + String(m % 60).padStart(2, '0') + 'm';
}

function wfTokens(n) {
  if (!n) return '';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k';
  return String(n);
}

// The notification summary reads `Dynamic workflow "<the real title>" completed`.
function wfTitleFrom(summary) {
  const m = summary && summary.match(/"([^"]{3,})"/);
  return m ? m[1] : (summary || 'Background task');
}

// A launch that hasn't reported back. No transcript entry exists for it, so the
// server appends it after the last message — see ConversationMessage.role.
function renderRunningCard(r) {
  if (!r) return '';
  const progress = r.agents_started != null
    ? `${r.agents_done || 0} / ${r.agents_started} agents`
    : '';
  const phases = (r.phases || []).map(p => `<span class="wf-phase">${esc(p.title)}</span>`).join('');
  return `<div class="chat-msg workflow">
    <div class="wf-card running">
      <div class="wf-head">
        <span class="wf-dot"></span>
        <span class="wf-name">${esc(r.label || r.kind || 'workflow')}</span>
        <span class="wf-elapsed" data-start="${esc(r.started_at || '')}"></span>
      </div>
      ${r.description ? `<div class="wf-desc">${esc(r.description)}</div>` : ''}
      ${progress ? `<div class="wf-stats">${esc(progress)}</div>` : ''}
      ${phases ? `<div class="wf-phases">${phases}</div>` : ''}
    </div>
  </div>`;
}

// The completion report, in place of the ~10KB of raw <task-notification> XML that
// used to render here as a chat bubble.
function renderTaskCard(t) {
  const status = (t.status || '').toLowerCase();
  const bad = status === 'failed' || status === 'killed';
  const u = t.usage;
  const warn = u && u.agents_error
    ? `<span class="wf-warn">${u.agents_error} failed</span>` : '';
  const stats = u ? [
    u.agent_count ? `${u.agent_count} agent${u.agent_count === 1 ? '' : 's'}` : '',
    u.agents_done ? `${u.agents_done} done` : '',
    u.subagent_tokens ? wfTokens(u.subagent_tokens) + ' tokens' : '',
    u.tool_uses ? `${u.tool_uses} tool calls` : '',
    u.duration_ms ? wfDuration(u.duration_ms) : '',
  ].filter(Boolean).join(' · ') : '';
  const id = 'wf_' + Math.random().toString(36).slice(2, 10);
  wfResultStore[id] = t;
  return `<div class="chat-msg report">
    <div class="wf-card ${bad ? 'failed' : ''}">
      <div class="wf-head">
        <span class="wf-pill ${bad ? status : ''}">${esc(t.status || 'done')}</span>
        <span class="wf-name">${esc(wfTitleFrom(t.summary))}</span>
        ${warn}
      </div>
      ${stats ? `<div class="wf-stats">${esc(stats)}</div>` : ''}
      ${t.result ? `<div class="wf-actions"><button class="wf-btn" onclick="openWfResult('${id}')">View result</button></div>` : ''}
    </div>
  </div>`;
}

// Elapsed ticks client-side from the launch timestamp. Deliberately NOT sent by the
// server: fetchMessages skips re-rendering when the JSON is byte-identical, and a
// server-side clock would differ every 2s and re-render the whole chat each poll.
function tickElapsed() {
  for (const el of document.querySelectorAll('.wf-elapsed[data-start]')) {
    const t = Date.parse(el.dataset.start);
    el.textContent = isNaN(t) ? '' : wfDuration(Date.now() - t);
  }
}
setInterval(tickElapsed, 1000);

function openWfResult(id) {
  const t = wfResultStore[id];
  if (!t) return;
  document.getElementById('modalTitle').textContent = 'Workflow result';
  const mc = document.getElementById('modalContent');
  let html = '';
  let parsed = null;
  try { parsed = JSON.parse(t.result); } catch (e) { /* plain text result */ }
  if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
    // A workflow returns an object whose values are usually markdown reports —
    // render each key as its own section rather than dumping JSON.
    html = Object.entries(parsed).map(([k, v]) => {
      const body = typeof v === 'string'
        ? renderMarkdown(v)
        : `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;
      return `<div class="wf-key">${esc(k)}</div>${body}`;
    }).join('');
  } else {
    html = t.result ? renderMarkdown(t.result) : '<div class="loading">No result payload</div>';
  }
  if (t.output_file) {
    html += `<div class="stats-note">Full output: ${esc(t.output_file)}</div>`;
  }
  mc.innerHTML = `<div class="wf-result">${html}</div>`;
  if (window.Prism) Prism.highlightAllUnder(mc);
  document.getElementById('toolModal').classList.add('active');
  history.pushState({ view: 'modal' }, '');
}

// Compute unified diff between two arrays of lines using LCS
function unifiedDiffHtml(oldLines, newLines) {
  // Build LCS table
  const m = oldLines.length, n = newLines.length;
  const dp = Array.from({length: m + 1}, () => new Uint16Array(n + 1));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = oldLines[i-1] === newLines[j-1]
        ? dp[i-1][j-1] + 1
        : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }

  // Backtrack to produce diff operations
  const ops = []; // {type: 'ctx'|'del'|'add', text}
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && oldLines[i-1] === newLines[j-1]) {
      ops.push({type: 'ctx', text: oldLines[i-1]});
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      ops.push({type: 'add', text: newLines[j-1]});
      j--;
    } else {
      ops.push({type: 'del', text: oldLines[i-1]});
      i--;
    }
  }
  ops.reverse();

  return ops.map(op => {
    const prefix = op.type === 'del' ? '-' : op.type === 'add' ? '+' : ' ';
    const cls = op.type === 'del' ? ' del' : op.type === 'add' ? ' add' : '';
    return `<div class="diff-line${cls}"><span class="line-no">${prefix}</span><span>${esc(op.text || ' ')}</span></div>`;
  }).join('');
}

function renderModalContent(name, detail) {
  const toolType = name.toLowerCase();

  if (toolType === 'workflow') {
    // The script itself — the plan in its most literal form.
    return `<pre><code class="language-javascript">${esc(detail)}</code></pre>`;
  }

  if (toolType === 'bash' || toolType === 'task') {
    return `<div class="tool-section-header">
        <div class="tool-section-icon"><span class="material-symbols-outlined">terminal</span></div>
        <span class="tool-section-label">BASH</span>
      </div>
      <div class="terminal-block">
        <button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('.cmd-text').textContent)">
          <span class="material-symbols-outlined" style="font-size:14px">content_copy</span> Copy
        </button>
        <span class="cmd-text"><span class="prompt">$</span> ${esc(detail)}</span>
      </div>`;
  }

  if (toolType === 'edit') {
    // Parse: "filepath\n\n--- old ---\nold_text\n\n+++ new +++\nnew_text"
    const parts = detail.split('\n\n');
    const filepath = parts[0] || '';
    const filename = filepath.split('/').pop() || filepath;
    let oldText = '', newText = '';
    let mode = '';
    for (let p = 1; p < parts.length; p++) {
      if (parts[p].startsWith('--- old ---')) { mode = 'old'; oldText = parts[p].replace(/^--- old ---\n?/, ''); continue; }
      if (parts[p].startsWith('+++ new +++')) { mode = 'new'; newText = parts[p].replace(/^\+\+\+ new \+\+\+\n?/, ''); continue; }
      if (mode === 'old') oldText += '\n\n' + parts[p];
      if (mode === 'new') newText += '\n\n' + parts[p];
    }

    // Line-level diff using LCS to produce unified interleaved output
    const diffHtml = unifiedDiffHtml(oldText.split('\n'), newText.split('\n'));

    return `<div class="tool-section-header">
        <div class="tool-section-icon"><span class="material-symbols-outlined">difference</span></div>
        <span class="tool-section-label">EDIT</span>
      </div>
      <div class="file-viewer">
        <div class="file-viewer-header">
          <span class="material-symbols-outlined">description</span>
          ${esc(filename)}
        </div>
        <div class="file-viewer-body">${diffHtml}</div>
      </div>`;
  }

  if (toolType === 'write') {
    // Parse: "filepath\n\ncontent"
    const idx = detail.indexOf('\n\n');
    const filepath = idx >= 0 ? detail.slice(0, idx) : '';
    const content = idx >= 0 ? detail.slice(idx + 2) : detail;
    const filename = filepath.split('/').pop() || filepath;
    return `<div class="tool-section-header">
        <div class="tool-section-icon"><span class="material-symbols-outlined">description</span></div>
        <span class="tool-section-label">WRITE</span>
      </div>
      <div class="file-viewer">
        <div class="file-viewer-header">
          <span class="material-symbols-outlined">description</span>
          ${esc(filename)}
        </div>
        <div class="write-body">${esc(content)}</div>
      </div>`;
  }

  if (toolType === 'read') {
    return `<div class="tool-section-header">
        <div class="tool-section-icon"><span class="material-symbols-outlined">menu_book</span></div>
        <span class="tool-section-label">READ</span>
      </div>
      <div class="file-viewer">
        <div class="file-viewer-header">
          <span class="material-symbols-outlined">description</span>
          ${esc(detail.split('/').pop() || detail)}
        </div>
        <div class="write-body">${esc(detail)}</div>
      </div>`;
  }

  // Fallback: generic pre block
  return `<pre>${esc(detail)}</pre>`;
}

// Event delegation for tool card clicks
document.addEventListener('click', (e) => {
  const card = e.target.closest('.tool-card');
  if (!card) return;
  const id = card.getAttribute('data-tool-id');
  const info = toolDetailStore[id];
  if (!info) return;
  document.getElementById('modalTitle').textContent = info.name;
  const mc = document.getElementById('modalContent');
  mc.innerHTML = renderModalContent(info.name, info.detail);
  if (window.Prism) Prism.highlightAllUnder(mc);
  document.getElementById('toolModal').classList.add('active');
  history.pushState({ view: 'modal' }, '');
});

function closeModal(event) {
  if (event && event.target !== document.getElementById('toolModal') && !event.target.classList.contains('modal-close') && !event.target.closest('.modal-close')) return;
  document.getElementById('toolModal').classList.remove('active');
}

// --- Status helpers ---
function statusInfo(s) {
  if (!s || !s.status) return { label: 'No Claude', cls: 'working', color: 'var(--outline)', dotColor: 'var(--outline)', needsAction: false };
  const st = s.status;
  if (st === 'Waiting') return { label: 'Idle', cls: 'idle', color: 'var(--secondary)', dotColor: 'var(--secondary)', needsAction: false };
  if (st === 'Working') return { label: 'Busy', cls: 'busy', color: 'var(--error)', dotColor: 'var(--error)', needsAction: false };
  if (st === 'QuestionAsked') return { label: 'Question', cls: 'attention', color: 'var(--tertiary-container)', dotColor: 'var(--tertiary-container)', needsAction: true };
  if (st === 'PlanReview') return { label: 'Plan Review', cls: 'attention', color: 'var(--tertiary-container)', dotColor: 'var(--tertiary-container)', needsAction: true };
  if (typeof st === 'object') {
    if (st.NeedsPermission) return { label: 'Permission', cls: 'attention', color: 'var(--tertiary-container)', dotColor: 'var(--tertiary-container)', needsAction: true };
    if (st.EditApproval) return { label: 'Edit Approval', cls: 'attention', color: 'var(--tertiary)', dotColor: 'var(--tertiary)', needsAction: true };
    if (st.RunningWorkflow) return { label: 'Workflow', cls: 'busy', color: 'var(--primary)', dotColor: 'var(--primary)', needsAction: false };
  }
  return { label: 'Busy', cls: 'busy', color: 'var(--error)', dotColor: 'var(--error)', needsAction: false };
}

function statusDetail(s) {
  if (!s || !s.status) return '';
  const st = s.status;
  if (typeof st === 'object') {
    if (st.NeedsPermission) {
      let d = st.NeedsPermission.tool_name || '';
      if (st.NeedsPermission.description) d += ' — ' + st.NeedsPermission.description;
      return d;
    }
    if (st.EditApproval) return 'File: ' + st.EditApproval.filename;
    if (st.RunningWorkflow) return st.RunningWorkflow.summary || '';
  }
  return '';
}

// --- Rendering ---
function extractEmoji(name) {
  // Try to extract leading emoji from session name
  const emojiMatch = name.match(/^(\p{Emoji_Presentation}|\p{Emoji}\uFE0F?)/u);
  if (emojiMatch && emojiMatch[0]) {
    return { emoji: emojiMatch[0], rest: name.slice(emojiMatch[0].length).trim() };
  }
  return { emoji: '', rest: name };
}

function renderSessionItem(s, isSkipped) {
  const si = statusInfo(s);
  const { emoji, rest } = extractEmoji(s.name);
  const displayEmoji = emoji || '\u{1F4BB}';
  const displayName = rest || s.name;
  const cpu = s.cpu > 0 ? 'CPU ' + s.cpu.toFixed(0) + '%' : '';
  const mem = s.mem_kb > 0 ? 'MEM ' + Math.round(s.mem_kb / 1024) + 'MB' : '';
  const metaParts = [cpu, mem].filter(Boolean);
  const skippedClass = isSkipped ? ' skipped' : '';
  const swipeLabel = isSkipped ? 'Unskip' : 'Skip';
  const swipeClass = isSkipped ? 'unskip-action' : 'skip-action';
  const todoBadge = (s.todo_count && s.todo_count > 0)
    ? `<span class="todo-badge"><span class="material-symbols-outlined">checklist</span>${s.todo_count}</span>`
    : '';
  if (todoBadge) metaParts.push(null); // placeholder, we'll append the badge HTML directly

  // Multi-window session → render as an accordion: tap the header to expand and
  // pick a specific Claude window; the header itself does not open a conversation.
  const windows = s.windows || [];
  if (windows.length > 1 && !isSkipped) {
    const expanded = expandedSessions.has(s.name) ? ' expanded' : '';
    const windowRows = windows.map(w => renderWindowRow(s, w)).join('');
    return `<div class="session-item-wrapper${expanded}" data-session-name="${esc(s.name)}">
      <div class="swipe-action ${swipeClass}">${swipeLabel}</div>
      <div class="session-item accordion-header" onclick="toggleAccordion('${encodeURIComponent(s.name)}')">
        <div class="emoji-box">${displayEmoji}</div>
        <div class="info">
          <div class="name-row">
            <div class="name">${esc(displayName)}</div>
            <div class="status-indicator">
              <span class="status-dot" style="background:${si.dotColor}"></span>
              <span class="status-label" style="color:${si.color}">${si.label}</span>
              <span class="material-symbols-outlined chevron">expand_more</span>
            </div>
          </div>
          <div class="meta"><span class="window-count"><span class="material-symbols-outlined" style="font-size:14px">grid_view</span>${windows.length} windows</span>${[cpu, mem].filter(Boolean).map(m => '<span>' + esc(m) + '</span>').join('')}${todoBadge}</div>
        </div>
      </div>
      <div class="accordion-windows">${windowRows}</div>
    </div>`;
  }

  return `<div class="session-item-wrapper" data-session-name="${esc(s.name)}">
    <div class="swipe-action ${swipeClass}">${swipeLabel}</div>
    <div class="session-item${skippedClass}" onclick="selectSession('${encodeURIComponent(s.name)}')">
      <div class="emoji-box">${displayEmoji}</div>
      <div class="info">
        <div class="name-row">
          <div class="name">${esc(displayName)}</div>
          ${!isSkipped ? `<div class="status-indicator">
            <span class="status-dot" style="background:${si.dotColor}"></span>
            <span class="status-label" style="color:${si.color}">${si.label}</span>
          </div>` : '<span class="status-label" style="color:var(--on-surface-variant);font-size:10px;font-weight:700;text-transform:uppercase">INACTIVE</span>'}
        </div>
        <div class="meta">${[cpu, mem].filter(Boolean).map(m => '<span>' + esc(m) + '</span>').join('')}${todoBadge}</div>
      </div>
    </div>
  </div>`;
}

// One row inside an expanded accordion, representing a single Claude window.
function renderWindowRow(s, w) {
  const si = statusInfo(w);
  const idx = w.window_index;
  // Prefer a meaningful window name; fall back to "Window N".
  let label = (w.window_name && !/^[0-9.]+$/.test(w.window_name)) ? w.window_name : ('Window ' + idx);
  const cpu = w.cpu > 0 ? 'CPU ' + w.cpu.toFixed(0) + '%' : '';
  const meta = [cpu].filter(Boolean).join(' · ');
  return `<div class="window-item" onclick="selectWindow('${encodeURIComponent(s.name)}','${encodeURIComponent(w.pane_id)}')">
    <span class="w-dot" style="background:${si.dotColor}"></span>
    <span class="w-name">${esc(label)}</span>
    ${meta ? `<span class="w-meta">${esc(meta)}</span>` : ''}
    <span class="w-status" style="color:${si.color}">${si.label}</span>
  </div>`;
}

// --- Sidebar mode rendering ---

// esc() escapes markup but NOT quotes, so it is unsafe for an attribute value —
// and session names are user data ("📊 [avateen] live-avatar").
function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Compact state vocabulary, matching the TUI's: idle / work / flow / perm /
// plan / ask / edit. The dashboard's longer labels ("Edit Approval") don't fit
// a panel column.
function sbStateWord(s) {
  const st = s && s.status;
  if (!st) return '—';
  if (st === 'Waiting') return 'idle';
  if (st === 'Working') return 'work';
  if (st === 'QuestionAsked') return 'ask';
  if (st === 'PlanReview') return 'plan';
  if (typeof st === 'object') {
    if (st.NeedsPermission) return 'perm';
    if (st.EditApproval) return 'edit';
    if (st.RunningWorkflow) return 'flow';
  }
  return 'work';
}

function sbAge(iso) {
  if (!iso) return '';
  const t = Date.parse(iso);
  if (isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

// Switch the attached tmux client to a conversation's window. This — not
// opening the transcript in a 300px column — is what clicking a sidebar row is
// for: the panel is a way INTO the work, not a place to read it.
async function sbSwitch(session, windowIndex) {
  // Optimistic: move the marker now, so the panel feels instant instead of
  // waiting out the next poll.
  currentFocus = { session, window_index: String(windowIndex == null ? '' : windowIndex) };
  renderList();
  try {
    await fetch('/api/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session, window_index: String(windowIndex == null ? '' : windowIndex) }),
    });
  } catch (e) { /* the next poll re-syncs the marker */ }
}

function sbIsCurrent(sessionName, windowIndex) {
  return !!currentFocus && currentFocus.session === sessionName &&
    String(currentFocus.window_index) === String(windowIndex);
}

// One row per CONVERSATION. A session hosting three of them contributes three
// rows — in the sidebar the conversation is the unit, not the session.
function sbConvRows(s, isSkipped) {
  const named = w => w && w.window_name && !/^[0-9.]+$/.test(w.window_name);
  const { rest } = extractEmoji(s.name);
  const proj = rest || s.name;
  const wins = s.windows || [];
  if (!wins.length) {
    return [{ title: proj, src: s, isSkipped, session: s.name, windowIndex: null }];
  }
  return wins.map(w => ({
    title: named(w) ? w.window_name : ('Window ' + w.window_index),
    src: w,
    isSkipped,
    session: s.name,
    windowIndex: w.window_index,
  }));
}

function sbRowHtml(r) {
  const si = statusInfo(r.src);
  const current = sbIsCurrent(r.session, r.windowIndex);
  const cls = (si.needsAction ? ' need' : '') + (r.isSkipped ? ' skip' : '') + (current ? ' current' : '');
  const age = sbAge(r.src && r.src.last_activity);
  // Session names carry spaces, emoji and `[project]` tags — they go in data
  // attributes (quote-escaped), never interpolated into an onclick expression.
  return `<div class="sb-row${cls}" onclick="sbRowClick(this)"
      data-session="${escAttr(r.session)}" data-window="${escAttr(r.windowIndex == null ? '' : r.windowIndex)}">
    <span class="sb-dot" style="background:${si.dotColor}"></span>
    <div class="sb-title">${esc(r.title)}</div>
    <span class="sb-age">${esc(age)}</span>
    <span class="sb-state" style="color:${si.color}">${sbStateWord(r.src)}</span>
  </div>`;
}

function sbRowClick(el) {
  sbSwitch(el.dataset.session, el.dataset.window === '' ? null : el.dataset.window);
}

// --- Project / worktree nesting (skipped + frozen) ---
//
// Live stays one group per session. Skipped and frozen are long tails where the
// same project's worktrees scatter across many top-level groups, so those nest:
// project, then its worktrees.

let sbProjectsBySession = {};
let sbProjectsByKey = {};

async function sbLoadProjects() {
  try {
    const list = await (await fetch('/api/projects')).json();
    sbProjectsBySession = {};
    sbProjectsByKey = {};
    list.forEach(p => { sbProjectsBySession[p.session_name] = p; sbProjectsByKey[p.key] = p; });
    renderList();
  } catch (e) { /* falls back to the raw session name */ }
}

// Where a session lives, from its name (see "Session Naming" in CLAUDE.md):
//   "📊 [avateen] live-avatar" -> project avateen, worktree live-avatar
//   "📊 Avateen"               -> project avateen, no worktree
// The registry supplies the display name; a worktree whose project isn't
// registered still groups correctly, just labelled by its key.
function sbPlaceOf(sessionName) {
  const name = String(sessionName || '');
  const m = name.match(/^(\S+)?\s*\[([^\]]+)\]\s*(.*)$/);
  if (m) {
    const key = m[2];
    const p = sbProjectsByKey[key];
    return {
      key,
      label: p ? p.display_name : key,
      emoji: (p && p.emoji) || m[1] || '',
      branch: m[3] || '(worktree)',
    };
  }
  const p = sbProjectsBySession[name];
  if (p) return { key: p.key, label: p.display_name, emoji: p.emoji, branch: null };
  const { emoji, rest } = extractEmoji(name);
  return { key: name, label: rest || name, emoji, branch: null };
}

// entries: [{ sessionName, html }] — source order preserved at every level.
function sbNestedHtml(entries) {
  const order = [];
  const byKey = new Map();
  entries.forEach(e => {
    const place = sbPlaceOf(e.sessionName);
    if (!byKey.has(place.key)) {
      byKey.set(place.key, { place, own: [], wtOrder: [], wt: new Map() });
      order.push(place.key);
    }
    const g = byKey.get(place.key);
    if (place.branch == null) { g.own.push(e.html); return; }
    if (!g.wt.has(place.branch)) { g.wt.set(place.branch, []); g.wtOrder.push(place.branch); }
    g.wt.get(place.branch).push(e.html);
  });
  return order.map(k => {
    const g = byKey.get(k);
    const worktrees = g.wtOrder.map(b => `<div class="sb-wt">
        <div class="sb-wt-head">${esc(b)}</div>
        ${g.wt.get(b).join('')}
      </div>`).join('');
    return `<div class="sb-group">
      <div class="sb-group-head"><span class="sb-group-emoji">${g.place.emoji || '\u{1F4BB}'}</span>${esc(g.place.label)}</div>
      ${g.own.join('')}${worktrees}
    </div>`;
  }).join('');
}

// A session = a project or a worktree, so grouping by session name is the
// worktree grouping ("📊 [avateen] live-avatar") for free.
function sbGroupHtml(s, isSkipped) {
  const { emoji, rest } = extractEmoji(s.name);
  const rows = sbConvRows(s, isSkipped).map(sbRowHtml).join('');
  return `<div class="sb-group">
    <div class="sb-group-head"><span class="sb-group-emoji">${emoji || '\u{1F4BB}'}</span>${esc(rest || s.name)}</div>
    ${rows}
  </div>`;
}

function sbFrozenHtml(f) {
  // The note is why you parked it — that's the headline, as on the TUI's 💤 screen.
  // The project now lives in the group header, so the row stays one line.
  const title = f.note || f.window_label || f.session_name;
  // "4d ago" -> "4d": the column is all ages, so the word is redundant.
  const age = String(f.relative || '').replace(/\s*ago$/, '');
  return `<div class="sb-row frozen" onclick="thawFrozen('${encodeURIComponent(f.key)}')">
    <span class="sb-dot frozen-dot">\u{1F4A4}</span>
    <div class="sb-title">${esc(title)}</div>
    <span class="sb-age">${esc(age)}</span>
  </div>`;
}

function sbSection(key, label, count, body) {
  const open = !sbCollapsed[key] ? ' open' : '';
  return `<div class="sb-sect${open}">
    <div class="sb-sect-head" onclick="sbToggle('${key}')">
      <span class="material-symbols-outlined sb-caret">chevron_right</span>${esc(label)} (${count})
    </div>
    <div class="sb-sect-body">${body}</div>
  </div>`;
}

function sbToggle(key) {
  sbCollapsed[key] = !sbCollapsed[key];
  renderList();
}

function renderSidebarList() {
  const el = document.getElementById('sessionList');
  // Source order, deliberately: the sidebar must list conversations in the same
  // order as the list view, so the two never disagree about "the third one down".
  const active = sessions.filter(s => !s.skipped);
  const skipped = sessions.filter(s => s.skipped);

  const liveRows = active.reduce((n, s) => n + sbConvRows(s, false).length, 0);
  const need = active.reduce((n, s) =>
    n + sbConvRows(s, false).filter(r => statusInfo(r.src).needsAction).length, 0);
  const h1 = document.querySelector('#listView .header h1');
  if (h1) h1.textContent = `${liveRows} LIVE${need ? ' · ' + need + ' NEED YOU' : ''}`;

  let html = active.length
    ? active.map(s => sbGroupHtml(s, false)).join('')
    : '<div class="sb-empty">No live conversations</div>';
  if (skipped.length) {
    html += sbSection('skipped', 'Skipped', skipped.length, sbNestedHtml(
      skipped.map(s => ({ sessionName: s.name, html: sbConvRows(s, true).map(sbRowHtml).join('') }))));
  }
  if (frozenList.length) {
    html += sbSection('frozen', 'Frozen', frozenList.length, sbNestedHtml(
      frozenList.map(f => ({ sessionName: f.session_name, html: sbFrozenHtml(f) }))));
  }
  el.innerHTML = html;
}

function renderList() {
  if (SIDEBAR) { renderSidebarList(); return; }
  if (listTab === 'resume') { renderResumeList(); return; }
  const el = document.getElementById('sessionList');
  if (!sessions.length) {
    el.innerHTML = '<div class="loading">No sessions found</div>';
    return;
  }
  const active = sessions.filter(s => !s.skipped);
  const skipped = sessions.filter(s => s.skipped);

  let html = '<div class="section-header">ACTIVE SESSIONS</div>';
  html += active.map(s => renderSessionItem(s, false)).join('');
  if (skipped.length) {
    html += '<div class="section-header skipped-header">SKIPPED</div>';
    html += skipped.map(s => renderSessionItem(s, true)).join('');
  }
  if (frozenList.length) {
    html += '<div class="section-header">FROZEN</div>';
    html += frozenList.map(renderFrozenItem).join('');
  }
  el.innerHTML = html;
}

// A frozen Claude window: tap to thaw (resume), trash icon to discard.
function renderFrozenItem(f) {
  const { emoji, rest } = extractEmoji(f.session_name);
  const win = f.window_label ? ' · ' + esc(f.window_label) : '';
  const note = f.note ? esc(f.note) : '<span style="opacity:0.5">no note</span>';
  const key = encodeURIComponent(f.key);
  return `<div class="frozen-item" onclick="thawFrozen('${key}')">
    <div class="frozen-emoji">\u{1F4A4}</div>
    <div class="frozen-info">
      <div class="frozen-name">${esc(rest || f.session_name)}${win}</div>
      <div class="frozen-note">${note}</div>
    </div>
    <div class="frozen-time">${esc(f.relative || '')}</div>
    <button class="frozen-discard" onclick="event.stopPropagation();discardFrozen('${key}')"><span class="material-symbols-outlined">delete</span></button>
  </div>`;
}

// Resume tab: closed/resumable conversations grouped by project, most recent
// first. Frozen conversations are excluded here — they live in the Active tab's
// FROZEN section (thaw brings them back).
function renderResumeList() {
  const el = document.getElementById('sessionList');
  if (!conversationsLoaded) {
    // Distinguish "still fetching" from "the fetch failed". Conflating them is what made a
    // dead network look like a broken tab — the spinner never ended and never explained itself.
    el.innerHTML = conversationsFailed
      ? '<div class="retry-load">Couldn\'t load conversations.<button onclick="retryConversations()">Retry</button></div>'
      : '<div class="loading"><span class="dot-pulse">Loading conversations...</span></div>';
    return;
  }
  const items = conversations.filter(c => c.lifecycle === 'closed' && !c.frozen);
  if (!items.length) {
    el.innerHTML = '<div class="loading">No resumable conversations</div>';
    return;
  }
  // Group by project (or the raw parent, or "other"), each sorted newest-first.
  const groups = new Map();
  for (const c of items) {
    const key = c.project_key || c.parent || 'other';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  }
  const groupList = [...groups.entries()].map(([key, arr]) => {
    arr.sort((a, b) => (b.last_activity || '').localeCompare(a.last_activity || ''));
    return { key, arr, recent: arr[0] ? (arr[0].last_activity || '') : '' };
  }).sort((a, b) => b.recent.localeCompare(a.recent));

  let html = '';
  for (const g of groupList) {
    const emoji = g.arr[0].emoji || '\u{1F4C1}';
    const label = g.key === 'other' ? 'OTHER' : g.key.toUpperCase();
    html += `<div class="section-header">${emoji} ${esc(label)} · ${g.arr.length}</div>`;
    html += g.arr.map(renderResumeItem).join('');
  }
  el.innerHTML = html;
}

function renderResumeItem(c) {
  const title = c.title || c.short_id;
  const rel = c.last_activity ? relativeTime(c.last_activity) : '';
  const profile = c.auth_profile ? `<span class="conv-profile">${esc(c.auth_profile)}</span>` : '';
  return `<div class="session-item resume-item" onclick="resumeConversation('${esc(c.id)}', this)">
    <div class="emoji-box">${c.emoji || '\u{1F4AC}'}</div>
    <div class="info">
      <div class="name-row">
        <div class="name">${esc(title)}</div>
        <span class="resume-time">${esc(rel)}</span>
      </div>
      <div class="meta"><span class="mono">${esc(c.short_id)}</span>${profile}</div>
    </div>
    <span class="material-symbols-outlined resume-icon">play_circle</span>
  </div>`;
}

// Resume a closed conversation: `claude --resume <id>` in its project/worktree
// session (created if needed), then jump to the Active tab where it appears.
async function resumeConversation(id, el) {
  if (el) { el.style.opacity = '0.5'; el.style.pointerEvents = 'none'; }
  try {
    const res = await fetch('/api/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    const r = await res.json();
    if (r.error) {
      alert('Resume failed: ' + r.error);
      if (el) { el.style.opacity = ''; el.style.pointerEvents = ''; }
      return;
    }
    lastSessionsJson = '';
    switchListTab('active');
    fetchSessions();
  } catch (e) {
    alert('Resume failed');
    if (el) { el.style.opacity = ''; el.style.pointerEvents = ''; }
  }
}

function updateDetailBadges(s) {
  const si = statusInfo(s);
  document.getElementById('detailDot').style.background = si.dotColor;

  const badges = document.getElementById('detailBadges');
  const detail = statusDetail(s);
  const badgeHtml = detail ? `<span class="badge attention">${esc(detail)}</span>` : '';
  badges.innerHTML = badgeHtml;

  const wrapper = document.getElementById('detailStatus');
  if (wrapper) wrapper.style.display = badgeHtml ? '' : 'none';

  const qa = document.getElementById('quickActions');
  if (si.needsAction) {
    qa.classList.remove('hidden');
  } else {
    qa.classList.add('hidden');
  }
}

// Human-friendly label for a window (its name, or "Window N").
function windowLabel(w) {
  return (w.window_name && !/^[0-9.]+$/.test(w.window_name)) ? w.window_name : ('Window ' + w.window_index);
}

// The object whose status drives the detail view: the selected window when one is
// chosen, otherwise the session aggregate.
function currentDetailObj() {
  const s = sessions.find(x => x.name === selectedSession);
  if (!s) return null;
  if (selectedWindow && s.windows) {
    const w = s.windows.find(w => w.pane_id === selectedWindow);
    if (w) return w;
  }
  return s;
}

function renderDetail() {
  if (!selectedSession) return;
  const s = sessions.find(x => x.name === selectedSession);
  if (!s) return;

  // Show the window name in the header only for multi-window sessions.
  let title = s.name;
  if (selectedWindow && s.windows && s.windows.length > 1) {
    const w = s.windows.find(w => w.pane_id === selectedWindow);
    if (w) title = s.name + ' · ' + windowLabel(w);
  }
  document.getElementById('detailName').textContent = title;
  updateDetailBadges(currentDetailObj() || s);
  renderMessages();
}

function renderMessages() {
  const chatArea = document.getElementById('chatArea');
  const isAtBottom = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 40;

  if (currentMessages.length === 0) {
    const s = sessions.find(x => x.name === selectedSession);
    if (s && s.claude_continue_failed) {
      chatArea.innerHTML =
        '<div class="chat-empty">' +
          '<div>No conversation to continue in this session.</div>' +
          '<button class="quick-btn" onclick="startClaude()">Start new Claude session</button>' +
        '</div>';
    } else {
      chatArea.innerHTML = '<div class="chat-empty">No messages yet</div>';
    }
  } else {
    let prevRole = '';
    chatArea.innerHTML = currentMessages.map((m, idx) => {
      // Neither of these is something a participant said, so they render full width
      // and reset the role run — the next real message re-labels itself.
      if (m.role === 'workflow') { prevRole = ''; return renderRunningCard(m.running); }
      if (m.task) { prevRole = ''; return renderTaskCard(m.task); }
      const showLabel = m.role !== prevRole;
      prevRole = m.role;
      const roleLabel = m.role === 'assistant' ? 'Claude' : 'You';
      const textHtml = m.text ? (m.role === 'assistant' ? renderMarkdown(m.text) : esc(m.text)) : '';
      const toolsHtml = m.role === 'assistant' ? renderToolCards(m.tools) : '';
      const hasContent = textHtml || toolsHtml;
      if (!hasContent) return '';
      return `<div class="chat-msg ${m.role}">
        ${showLabel ? `<div class="role-label">${roleLabel}</div>` : ''}
        ${textHtml ? `<div class="msg-bubble"><div>${textHtml}</div></div>` : ''}
        ${toolsHtml}
      </div>`;
    }).join('');

    if (isAtBottom || wasAtBottom) {
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  }

  // Show/hide TTS button based on whether there's an assistant message
  const ttsBar = document.getElementById('ttsBar');
  const hasAssistant = currentMessages.some(m => m.role === 'assistant' && m.text);
  if (ttsEnabled && hasAssistant) {
    ttsBar.classList.add('visible');
  } else {
    ttsBar.classList.remove('visible');
  }

  // Paint the running cards' clocks immediately (the 1s tick takes over after).
  tickElapsed();

  // Syntax highlight code blocks
  if (window.Prism) Prism.highlightAllUnder(chatArea);
}

// --- Web viewing telemetry (a stream separate from tmux focus) ---
// web_view = now looking at a session (or the list, when session is null);
// web_blur = tab hidden or page closing → stop counting. Beacon survives unload.
function postWebEvent(event, session, useBeacon) {
  try {
    const payload = JSON.stringify({ event: event, session: session || null });
    if (useBeacon && navigator.sendBeacon) {
      navigator.sendBeacon('/api/web-event', payload);
    } else {
      fetch('/api/web-event', { method: 'POST', body: payload, keepalive: true }).catch(() => {});
    }
  } catch (e) {}
}

// --- Navigation (uses History API so iOS back gesture works) ---
function openConversation(name, paneId) {
  stopTts();
  selectedSession = name;
  postWebEvent('web_view', name);
  selectedWindow = paneId || null;
  currentMessages = [];
  lastMessagesJson = '';
  wasAtBottom = true;
  history.pushState({ view: 'detail', session: name, window: selectedWindow }, '');
  showDetailView();
  fetchMessages();
  startMessagePolling();
}

function selectSession(encodedName) {
  const name = decodeURIComponent(encodedName);
  const s = sessions.find(x => x.name === name);
  // A single-window session routes straight to its one Claude; a session with no
  // window data falls back to the session-level conversation (paneId null).
  const paneId = (s && s.windows && s.windows.length === 1) ? s.windows[0].pane_id : null;
  openConversation(name, paneId);
}

// Toggle a multi-window session's accordion open/closed.
function toggleAccordion(encodedName) {
  const name = decodeURIComponent(encodedName);
  if (expandedSessions.has(name)) {
    expandedSessions.delete(name);
  } else {
    expandedSessions.add(name);
  }
  renderList();
}

// Open the conversation for a specific window within a session.
function selectWindow(encodedName, encodedPaneId) {
  openConversation(decodeURIComponent(encodedName), decodeURIComponent(encodedPaneId));
}

function showList() {
  selectedSession = null;
  selectedWindow = null;
  postWebEvent('web_view', null);
  currentMessages = [];
  stopMessagePolling();
  stopTts();
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('detailView').classList.remove('active');
}

function showDetailView() {
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.add('active');
  renderDetail();
}

let lastMessagesJson = '';

async function fetchMessages() {
  if (!selectedSession) return;
  try {
    const windowParam = selectedWindow ? '&window=' + encodeURIComponent(selectedWindow) : '';
    const res = await fetch('/api/messages?session=' + encodeURIComponent(selectedSession) + windowParam);
    const json = await res.text();
    if (json === lastMessagesJson) return; // No change, skip re-render
    lastMessagesJson = json;
    const chatArea = document.getElementById('chatArea');
    wasAtBottom = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 40;
    currentMessages = JSON.parse(json);
    renderMessages();
  } catch (e) { /* ignore */ }
}

function startMessagePolling() {
  stopMessagePolling();
  msgPollTimer = setInterval(fetchMessages, 2000);
}

function stopMessagePolling() {
  if (msgPollTimer) { clearInterval(msgPollTimer); msgPollTimer = null; }
}

// Handle browser back gesture / back button
window.addEventListener('popstate', (e) => {
  // Close info modal first
  if (document.getElementById('infoModal').classList.contains('active')) {
    document.getElementById('infoModal').classList.remove('active');
    if (selectedSession) {
      history.pushState({ view: 'detail', session: selectedSession }, '');
    }
    return;
  }
  // Close tool modal
  if (document.getElementById('toolModal').classList.contains('active')) {
    document.getElementById('toolModal').classList.remove('active');
    // Re-push state so detail view stays
    if (selectedSession) {
      history.pushState({ view: 'detail', session: selectedSession }, '');
    }
    return;
  }
  // Close picker modal
  if (document.getElementById('pickerModal').classList.contains('active')) {
    document.getElementById('pickerModal').classList.remove('active');
    return;
  }
  // Close usage/stats modal
  if (document.getElementById('statsModal').classList.contains('active')) {
    document.getElementById('statsModal').classList.remove('active');
    return;
  }
  showList();
});

// Push initial state so first back doesn't leave the page
history.replaceState({ view: 'list' }, '');

// Web viewing telemetry: page load starts a view; tab hide/show and page close bound it so we
// stop counting when the browser loses focus or is closed.
postWebEvent('web_view', selectedSession);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) postWebEvent('web_blur', null, true);
  else postWebEvent('web_view', selectedSession);
});
window.addEventListener('pagehide', () => postWebEvent('web_blur', null, true));

// --- Sending ---
async function sendQuick(text) {
  if (!selectedSession) return;
  const s = sessions.find(x => x.name === selectedSession);
  if (!s || !s.pane) return;
  try {
    const body = { session: s.name, text: text };
    if (selectedWindow) body.window = selectedWindow;
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch (e) { /* ignore */ }
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !selectedSession) return;
  input.value = '';
  wasAtBottom = true;
  await sendQuick(text);
}

// Launch a fresh `claude` in a session whose `claude -c` exited (no conversation).
async function startClaude() {
  if (!selectedSession) return;
  await sendQuick('claude');
  wasAtBottom = true;
}

// --- Polling ---
let lastSessionsJson = '';
let lastFrozenJson = '';
let lastConversationsJson = '';

// --- Connection state ---
// A failed poll leaves the last good `sessions` on screen, so nothing about the list
// says "this is stale". Track failures and surface them: one blip is ignored, a second
// consecutive miss raises the banner with the age of what you're actually looking at.
let pollFailures = 0;
let lastSyncAt = 0;
const OFFLINE_AFTER = 2;

function markOnline() {
  pollFailures = 0;
  lastSyncAt = Date.now();
  document.getElementById('connDot').style.background = 'var(--secondary)';
  document.querySelector('.conn-label').textContent = 'Connected';
  document.getElementById('offlineBanner').hidden = true;
}

function markOffline() {
  pollFailures++;
  document.getElementById('connDot').style.background = 'var(--error)';
  document.querySelector('.conn-label').textContent = 'Offline';
  if (pollFailures < OFFLINE_AFTER) return;
  const banner = document.getElementById('offlineBanner');
  // Only worth stating once the data is actually old — "from just now" is noise.
  const stale = lastSyncAt && Date.now() - lastSyncAt > 60000;
  const age = stale ? relativeTime(new Date(lastSyncAt).toISOString()) : '';
  document.getElementById('offlineStale').textContent = age ? ` · showing data from ${age}` : '';
  banner.hidden = false;
  // A list that never loaded has nothing to keep showing — offer a way back.
  if (listTab === 'resume' && !conversationsLoaded) renderList();
}

async function fetchSessions() {
  try {
    // Active view now comes from the conversation model (/api/active). Same
    // SessionView shape as the old /api/sessions, so rendering is unchanged.
    const res = await fetch('/api/active');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.text();

    // Frozen windows are polled alongside sessions (cheap on localhost).
    let frJson = '[]';
    try { frJson = await (await fetch('/api/frozen')).text(); } catch (e) { /* keep last */ }

    // Where the attached tmux client is looking, so the sidebar can mark "you are
    // here". Sidebar-only: the phone has no client to be "at".
    let focusJson = lastFocusJson;
    if (SIDEBAR) {
      try {
        focusJson = await (await fetch('/api/current-focus')).text();
        currentFocus = JSON.parse(focusJson);
      } catch (e) { /* keep last */ }
    }

    sessions = JSON.parse(json);
    frozenList = JSON.parse(frJson);
    // Only after a parse that actually yielded data — a reachable server returning
    // garbage is not "connected", and marking it so would suppress the banner forever.
    markOnline();

    // Only re-render the list when either set actually changed. (The Resume tab
    // renders from `conversations`, refreshed separately by fetchConversations.)
    if (listTab === 'active' && (json !== lastSessionsJson || frJson !== lastFrozenJson || focusJson !== lastFocusJson)) {
      renderList();
    }
    lastFocusJson = focusJson;
    lastSessionsJson = json;
    lastFrozenJson = frJson;

    // The resumable set changes slowly and is only visible on the Resume tab, so
    // poll it only while that tab is showing.
    if (listTab === 'resume') fetchConversations();

    // In detail view, only update badges (not chat — that has its own poll)
    if (selectedSession) {
      const obj = currentDetailObj();
      if (obj) updateDetailBadges(obj);
    }
  } catch (e) {
    markOffline();
  }
}

// Fetch closed/resumable conversations for the Resume tab (own cadence).
async function fetchConversations() {
  try {
    const json = await (await fetch('/api/conversations')).text();
    conversations = JSON.parse(json);
    conversationsLoaded = true;
    conversationsFailed = false;
    if (json !== lastConversationsJson) {
      lastConversationsJson = json;
      if (listTab === 'resume') renderList();
    }
  } catch (e) {
    // Keep any list we already have (the banner reports the staleness). With nothing
    // loaded there's no list to keep, and silently returning here is what left the
    // Resume tab spinning forever — so record the failure and let it render a retry.
    conversationsFailed = true;
    if (listTab === 'resume' && !conversationsLoaded) renderList();
  }
}

// Retry button on the Resume tab: back to the spinner, then try again.
function retryConversations() {
  conversationsFailed = false;
  renderList();
  fetchConversations();
}

// Switch the session list between the live Active view and the Resume view.
function switchListTab(tab) {
  if (tab === listTab) return;
  listTab = tab;
  for (const el of document.querySelectorAll('.list-tab')) {
    el.classList.toggle('active', el.dataset.tab === tab);
  }
  renderList();
  if (tab === 'resume') fetchConversations();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- TTS ---
let ttsEnabled = false;
let ttsAudio = null;

// Persistent audio element in the DOM — iOS needs this for reliable playback.
// We create it once, reuse it, and "unlock" it on the first user tap.
// TTS player — get from DOM element (iOS needs it visible and in the document)
const ttsPlayer = document.getElementById('ttsVideo');

async function initTts() {
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    ttsEnabled = cfg.tts === true;
    if (ttsEnabled) {
      document.getElementById('ttsBar').classList.add('visible');
    }
  } catch (e) { /* TTS stays disabled */ }
}

let ttsGenerating = false;
let ttsCachedText = null;
let ttsCachedUrl = null;
let ttsSessionId = null;
let ttsActiveBtn = null; // 'last' | 'tldr' | null

function resetTtsBtn() {
  const lastBtn = document.getElementById('ttsBtn');
  const tldrBtn = document.getElementById('tldrBtn');
  lastBtn.querySelector('.tts-label').textContent = 'Read Last';
  lastBtn.querySelector('.tts-icon').textContent = 'volume_up';
  lastBtn.classList.remove('loading', 'busy-state');
  lastBtn.style.display = '';
  tldrBtn.querySelector('.tts-label').textContent = 'TLDR';
  tldrBtn.querySelector('.tts-icon').textContent = 'summarize';
  tldrBtn.classList.remove('loading', 'busy-state');
  tldrBtn.style.display = '';
  ttsGenerating = false;
  ttsActiveBtn = null;
}

function cancelTtsSession() {
  if (ttsSessionId) {
    fetch('/api/tts-cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: ttsSessionId })
    }).catch(() => {});
    ttsSessionId = null;
  }
}

function stopTts() {
  ttsPlayer.pause();
  ttsPlayer.removeAttribute('src');
  ttsPlayer.load();
  if (window._hlsInstance) { window._hlsInstance.destroy(); window._hlsInstance = null; }
  cancelTtsSession();
  ttsCachedText = null;
  ttsCachedUrl = null;
  resetTtsBtn();
}

async function playTtsHls(text, btnId) {
  // Stop if already playing
  if (!ttsPlayer.paused) { stopTts(); return; }
  if (!selectedSession || !ttsEnabled || ttsGenerating) return;
  if (!text || !text.trim()) return;

  const btn = document.getElementById(btnId);
  const otherBtn = document.getElementById(btnId === 'ttsBtn' ? 'tldrBtn' : 'ttsBtn');

  ttsGenerating = true;
  ttsActiveBtn = btnId;
  btn.classList.add('loading', 'busy-state');
  btn.querySelector('.tts-label').textContent = 'Generating...';
  btn.querySelector('.tts-icon').textContent = 'hourglass_top';
  otherBtn.style.display = 'none';

  ttsPlayer.pause();
  ttsCachedText = null;
  ttsCachedUrl = null;

  // iOS user gesture unlock
  ttsPlayer.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  ttsPlayer.play().catch(() => {});

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try {
    const res = await fetch('/api/tts-hls', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        voice: 'michael_caine',
        language: 'English',
        speed: 1.0,
        summarize: true
      })
    });

    if (!res.ok) throw new Error('TTS request failed');
    const data = await res.json();
    if (!data.playlist_url) throw new Error('No playlist URL');

    ttsSessionId = data.session_id || null;
    ttsCachedText = text;
    ttsCachedUrl = data.playlist_url;

    if (window._hlsInstance) { window._hlsInstance.destroy(); window._hlsInstance = null; }

    ttsPlayer.oncanplay = () => {
      btn.querySelector('.tts-label').textContent = 'Stop';
      btn.querySelector('.tts-icon').textContent = 'stop_circle';
      btn.classList.remove('loading');
    };
    ttsPlayer.onended = () => { resetTtsBtn(); if (window._hlsInstance) { window._hlsInstance.destroy(); window._hlsInstance = null; } };
    ttsPlayer.onerror = () => resetTtsBtn();

    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: false,
        maxBufferHole: 0.5,
        maxMaxBufferLength: 60,
        nudgeOffset: 0.1,
        nudgeMaxRetry: 5,
      });
      window._hlsInstance = hls;
      hls.loadSource(data.playlist_url);
      hls.attachMedia(ttsPlayer);
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (d.fatal) resetTtsBtn();
      });
      await ttsPlayer.play();
    } else if (ttsPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      ttsPlayer.src = data.playlist_url;
      ttsPlayer.load();
      await ttsPlayer.play();
    } else {
      throw new Error('HLS not supported');
    }
  } catch (e) {
    resetTtsBtn();
  } finally {
    ttsGenerating = false;
  }
}

function speakLastMessage() {
  const lastAssistant = [...currentMessages].reverse().find(m => m.role === 'assistant' && m.text);
  if (!lastAssistant) return;
  playTtsHls(lastAssistant.text, 'ttsBtn');
}

function speakTldr() {
  // Find last user message
  let lastUserIdx = -1;
  for (let i = currentMessages.length - 1; i >= 0; i--) {
    if (currentMessages[i].role === 'user') { lastUserIdx = i; break; }
  }

  // Collect all assistant messages since then
  const msgs = lastUserIdx >= 0
    ? currentMessages.slice(lastUserIdx + 1)
    : currentMessages;

  // Build briefing text
  let briefing = '';
  for (const m of msgs) {
    if (m.role !== 'assistant') continue;
    if (m.text) briefing += m.text + '\n\n';
    for (const t of (m.tools || [])) {
      briefing += 'Used ' + t.name + ': ' + t.summary + '\n';
    }
  }

  if (!briefing.trim()) return;
  playTtsHls(briefing, 'tldrBtn');
}

// --- Swipe to Skip/Unskip ---
(function() {
  let swipeTarget = null;
  let startX = 0, startY = 0, currentX = 0;
  let isSwiping = false;
  let directionLocked = false;

  document.addEventListener('touchstart', (e) => {
    const wrapper = e.target.closest('.session-item-wrapper');
    if (!wrapper) return;
    const item = wrapper.querySelector('.session-item');
    if (!item) return;
    swipeTarget = { wrapper, item };
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    currentX = 0;
    isSwiping = false;
    directionLocked = false;
    item.classList.remove('swipe-animating');
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!swipeTarget) return;
    const touch = e.touches[0];
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;

    if (!directionLocked) {
      if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10) return;
      directionLocked = true;
      if (Math.abs(deltaY) > Math.abs(deltaX)) {
        // Vertical scroll — abort swipe
        swipeTarget = null;
        return;
      }
      isSwiping = true;
    }

    if (!isSwiping) return;

    // Only allow left swipe (negative deltaX)
    currentX = Math.min(0, deltaX);
    if (currentX < -20) {
      swipeTarget.item.style.transform = 'translateX(' + currentX + 'px)';
    }
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!swipeTarget || !isSwiping) {
      swipeTarget = null;
      return;
    }
    const { wrapper, item } = swipeTarget;
    swipeTarget = null;

    if (currentX < -80) {
      // Threshold reached — trigger skip/unskip
      item.classList.add('swipe-animating');
      item.style.transform = 'translateX(-100%)';
      const sessionName = wrapper.getAttribute('data-session-name');
      toggleSkip(sessionName);
    } else {
      // Snap back
      item.classList.add('swipe-animating');
      item.style.transform = 'translateX(0)';
    }
    isSwiping = false;
  }, { passive: true });
})();

async function toggleSkip(sessionName) {
  try {
    await fetch('/api/toggle-flag', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: sessionName, flag: 'skip' })
    });
    lastSessionsJson = '';
    fetchSessions();
  } catch (e) { /* ignore */ }
}

let pickerProjects = [];

async function openPicker() {
  history.pushState({ view: 'picker' }, '');
  document.getElementById('pickerModal').classList.add('active');
  document.getElementById('pickerSearch').value = '';
  document.getElementById('pickerList').innerHTML = '<div class="loading"><span class="dot-pulse">Loading projects...</span></div>';
  try {

    pickerProjects = await res.json();
    renderPickerList(pickerProjects);
  } catch (e) {
    document.getElementById('pickerList').innerHTML = '<div class="loading">Failed to load projects</div>';
  }
}

function closePicker() {
  if (document.getElementById('pickerModal').classList.contains('active')) {
    document.getElementById('pickerModal').classList.remove('active');
    history.back();
  }
}

function filterPicker() {
  const query = document.getElementById('pickerSearch').value.toLowerCase();
  const filtered = pickerProjects.filter(p => {
    const name = (p.display_name || p.key || '').toLowerCase();
    return name.includes(query) || (p.emoji || '').includes(query);
  });
  renderPickerList(filtered);
}

function renderPickerList(projects) {
  const el = document.getElementById('pickerList');
  if (!projects.length) {
    el.innerHTML = '<div class="loading">No projects found</div>';
    return;
  }
  el.innerHTML = projects.map(p => {
    const emoji = p.emoji || '\u{1F4E6}';
    const name = p.display_name || p.key;
    const exists = p.exists;
    const dotColor = exists ? 'var(--secondary)' : 'var(--outline)';
    const statusLabel = exists ? 'Running' : 'Not started';
    return `<div class="picker-item" data-session-name="${esc(p.session_name)}">
      <div class="picker-emoji">${emoji}</div>
      <div class="picker-info">
        <div class="picker-name">${esc(name)}</div>
        <div class="picker-status">
          <span class="picker-status-dot" style="background:${dotColor}"></span>
          <span class="picker-status-label">${statusLabel}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Event delegation for picker item clicks
document.getElementById('pickerList').addEventListener('click', (e) => {
  const item = e.target.closest('.picker-item');

  const sessionName = item.getAttribute('data-session-name');

});

    await fetch('/api/connect', {
      method: 'POST',

let currentInfoSession = null;
let currentInfoData = null;

function relativeTime(ts) {
  const t = Date.parse(ts);
  if (isNaN(t)) return '';
  const secs = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (secs < 60) return 'just now';
  if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
  if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
  return Math.floor(secs / 86400) + 'd ago';
}

async function openStats() {
  history.pushState({ view: 'stats' }, '');

function closeStatsModal(event) {
  if (event && event.target !== document.getElementById('statsModal') && !event.target.classList.contains('modal-close') && !event.target.closest('.modal-close')) return;
  if (document.getElementById('statsModal').classList.contains('active')) {
    document.getElementById('statsModal').classList.remove('active');

}

function switchStatsTab(tab) {
  for (const el of document.querySelectorAll('.stats-tab')) {
    el.classList.toggle('active', el.dataset.tab === tab);
  }
  for (const el of document.querySelectorAll('.stats-pane')) {
    el.classList.toggle('hidden', el.dataset.pane !== tab);
  }
}

function renderStats(d) {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cell = (num, label) => '<div class="stat-cell"><div class="stat-num">' + (num || 0) + '</div><div class="stat-label">' + label + '</div></div>';
  const label = (ev) => ({ window_open: 'open', window_close: 'close', window_freeze: 'freeze', window_thaw: 'thaw', session_kill: 'kill', focus: 'focus', blur: 'blur', skip: 'skip', unskip: 'unskip', spread: 'spread', collapse: 'collapse', web_view: 'view', web_blur: 'away' }[ev] || ev);
  const cls = (ev) => ({ window_open: 'open', window_close: 'close', window_freeze: 'freeze', window_thaw: 'thaw', session_kill: 'kill' }[ev] || '');
  const fmtDur = (secs) => { const m = Math.floor(secs / 60); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : (m >= 1 ? m + 'm' : secs + 's'); };
  const timeRows = (list, total) => {
    if (!list || !list.length) return '';
    const max = Math.max(1, ...list.map((x) => x.secs));
    let h = '<div class="stats-section-title">Active time · ' + fmtDur(total) + ' total</div>';
    for (const x of list.slice(0, 8)) {
      const pct = Math.round((x.secs / max) * 100);
      h += '<div class="bar-row"><span class="bar-day" style="width:auto;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.session) + '</span>'
        + '<span class="bar-track" style="max-width:120px"><span class="bar-fill" style="width:' + pct + '%"></span></span>'
        + '<span class="bar-num" style="width:auto;min-width:44px">' + fmtDur(x.secs) + '</span></div>';
    }
    return h;
  };
  const recentRows = (events) => {
    if (!events || !events.length) return '<div class="loading" style="padding:16px">Nothing yet.</div>';
    let h = '';
    for (const e of events) {
      const who = esc(e.session || '') + (e.window ? ' · ' + esc(e.window) : '');
      h += '<div class="recent-row"><span class="recent-when">' + esc(relativeTime(e.ts)) + '</span>'
        + '<span class="recent-ev ' + cls(e.event) + '">' + label(e.event) + '</span>'
        + '<span class="recent-who">' + who + '</span></div>';
    }
    return h;
  };

  // --- Sessions tab (tmux lifecycle + switches) ---
  let sessions = '<div class="stats-grid">';
  sessions += cell(d.opened, 'opened');
  sessions += cell(d.closed, 'closed');
  sessions += cell(d.open_now, 'open now');
  sessions += cell(d.frozen, 'frozen');
  sessions += cell(d.thawed, 'thawed');
  sessions += cell(d.killed, 'killed');
  sessions += cell(d.switches, 'switches');
  sessions += '</div>';
  const byDay = d.opens_by_day || [];
  if (byDay.length) {
    const max = Math.max(1, ...byDay.map((x) => x.count));
    sessions += '<div class="stats-section-title">Windows opened by day</div>';
    for (const x of byDay) {
      const pct = Math.round((x.count / max) * 100);
      sessions += '<div class="bar-row"><span class="bar-day">' + esc(x.day) + '</span>'
        + '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>'
        + '<span class="bar-num">' + x.count + '</span></div>';
    }
  }
  sessions += timeRows(d.active_by_session, d.active_total_secs);
  if (d.slept_secs) sessions += '<div class="stats-note">' + fmtDur(d.slept_secs) + ' of machine sleep subtracted (from the OS power log).</div>';
  sessions += '<div class="stats-section-title" style="margin-top:20px">Recent</div>' + recentRows(d.recent_sessions);

  // --- Web tab (dashboard viewing) ---
  let web = '<div class="stats-grid">';
  web += cell(d.web_views, 'views');
  web += cell(d.web_sessions, 'sessions seen');
  web += '</div>';
  web += '<div class="stats-note">Time you spent viewing sessions in this dashboard — a separate stream from the tmux "switches" above.</div>';
  web += timeRows(d.web_by_session, d.web_total_secs);
  web += '<div class="stats-section-title" style="margin-top:20px">Recent</div>' + recentRows(d.recent_web);

  const html = '<div class="stats-tabs">'
    + '<button class="stats-tab active" data-tab="sessions" onclick="switchStatsTab(\'sessions\')">Sessions</button>'
    + '<button class="stats-tab" data-tab="web" onclick="switchStatsTab(\'web\')">Web</button>'
    + '</div>'
    + '<div class="stats-pane" data-pane="sessions">' + sessions + '</div>'
    + '<div class="stats-pane hidden" data-pane="web">' + web + '</div>';
  document.getElementById('statsContent').innerHTML = html;
}
