<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive Tasks</title>
<link rel="stylesheet" href="/board-common.css">
<style>
  /* Task-board only; the rest is in board-common.css. */
  :root { --warn: #b38600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --warn: #e2b203; } }
  :root[data-theme="dark"] { --warn: #e2b203; }
  .card.done { opacity: .72; }
  .card .why { font-size: 12px; color: var(--s-blocked); background: color-mix(in srgb, var(--s-blocked) 10%, transparent);
               border-radius: 4px; padding: 3px 6px; line-height: 1.35; }
  .tag.late { color: var(--s-blocked); }
  .tag.warn { color: var(--warn); cursor: help; }
  .foot .age.stale { color: var(--warn); font-weight: 600; }
  .dialog.wide { max-width: 560px; max-height: 86vh; overflow: auto; }
  .dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12px; }
  .dialog dt { color: var(--faint); }
  .dialog dd { word-break: break-word; }
  .dialog pre { white-space: pre-wrap; font: 12px/1.5 inherit; color: var(--muted); margin: 0; }
  .dialog .issues { font-size: 12px; color: var(--warn); }
  .dialog .err { color: var(--s-blocked); }
  /* A strict board's required fields: one labelled control each, under the title. */
  .dialog .fields { display: flex; flex-direction: column; gap: 10px; }
  .dialog .fields:empty { display: none; }
  .dialog label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .dialog select {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; outline: none;
  }
  .dialog select:focus { border-color: var(--accent); }
  /* The per-column "+": quiet until you reach for it, but never hidden (no hover on a phone). */
  .colhead .add {
    margin-left: auto; width: 22px; height: 22px; padding: 0; border-radius: 5px;
    border: 1px solid transparent; background: none; color: var(--faint);
    font: inherit; font-size: 16px; line-height: 1; cursor: pointer;
  }
  .colhead .add:hover, .colhead .add:focus-visible {
    color: var(--text); background: var(--col); border-color: var(--line); outline: none;
  }
</style>
</head>
<body>
<header>
  <h1>🐝 hive <span>tasks</span></h1>
  <select class="board-sel" id="boardSel" title="Switch board"></select>
  <div class="strip" id="strip"></div>
  <span class="offline" id="offline" hidden>offline</span>
  <div class="spacer"></div>
  <input class="search" id="search" placeholder="Filter…" autocomplete="off">
  <div>
    <span class="seg-label">Sort</span>
    <div class="seg" id="sorts">
      <button data-v="priority">Priority</button>
      <button data-v="stalest">Stalest</button>
    </div>
  </div>
  <div>
    <span class="seg-label">Lanes</span>
    <div class="seg" id="lanes"><button data-v="none">None</button></div>
  </div>
</header>
<main>
  <div class="board" id="board"></div>
</main>

<div class="scrim" id="scrim">
  <form class="dialog" id="dialog">
    <h2>Blocked on what?</h2>
    <p id="dialogFor"></p>
    <input id="reason" placeholder="e.g. waiting on staging creds" autocomplete="off">
    <div class="row">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Move to Blocked</button>
    </div>
  </form>
</div>
<div class="scrim" id="addScrim">
  <form class="dialog" id="addForm">
    <h2>New task</h2>
    <p id="addFor"></p>
    <input id="addTitle" placeholder="What needs doing?" autocomplete="off" maxlength="300">
    <div class="fields" id="addFields"></div>
    <p class="err" id="addErr" hidden></p>
    <div class="row">
      <button type="button" id="addCancel">Cancel</button>
      <button type="submit" class="primary calm" id="addGo">Add</button>
    </div>
  </form>
</div>
<div class="scrim" id="detailScrim"><div class="dialog wide" id="detail"></div></div>
<div class="menu" id="menu" role="menu"></div>
<div class="toast" id="toast"></div>

<script src="/board-common.js"></script>
<script>
const { $, esc, post, toast } = Board;
const store = Board.store('hiveTasks:');

let project = '', data = null, tasks = [];
let lastJson = '', query = '', pendingBlock = null, menuTask = null;
let sortMode = store.get('sort', 'priority');
let laneBy = '';          // header field the lanes group by; '' = no lanes
let folded = new Set();

// Board columns reuse the conversation board's stage colours.
const KNOWN = ['todo', 'planning', 'in_progress', 'blocked', 'done'];
const ALIAS = { doing: 'in_progress', tracking: 'planning' };
const colVar = k => { const m = ALIAS[k] || k; return `var(--s-${KNOWN.includes(m) ? m : 'todo'})`; };
const label = k => k.charAt(0).toUpperCase() + k.slice(1);
const PRIO = {
  high:   { label: 'high',   v: '--rt-needs' },
  medium: { label: 'medium', v: '--rt-working' },
  low:    { label: 'low',    v: '--rt-off' },
};
const prioRank = { high: 0, medium: 1, low: 2, none: 3 };

const field = (t, k) => { const f = t.fields.find(f => f[0].toLowerCase() === k.toLowerCase()); return f ? f[1] : ''; };
// Lanes group by one header field. The board's `group_by` leads (area when unset); the others
// are offered once some task carries them, so a board with no `type` never shows an empty Type.
const LANE_FIELDS = ['area', 'epic', 'type'];
const defaultLane = () => ((data && data.group_by) || 'area').toLowerCase();
const laneChoices = () => [...new Set([defaultLane(), ...LANE_FIELDS])]
  .filter(k => k === defaultLane() || k === laneBy || tasks.some(t => field(t, k)));
// Folded lanes are remembered per field. The default field keeps the original key, so
// what was folded before lanes could switch field still is.
const foldKey = () => 'folded:' + project + (laneBy && laneBy !== defaultLane() ? ':' + laneBy : '');
let laneSegKey = '';
function renderLaneSeg() {
  const fields = laneChoices(), key = fields.join(',');
  if (key === laneSegKey) return;
  laneSegKey = key;
  $('#lanes').innerHTML = '<button data-v="none">None</button>' +
    fields.map(k => `<button data-v="${esc(k)}">${esc(label(k))}</button>`).join('');
}
const ageDays = t => t.modified ? Math.max(0, Math.floor((Date.now() - Date.parse(t.modified)) / 864e5)) : null;
const isOpen = t => !t.completed && t.column !== 'done';
const issuesOf = t => data.schema_on ? (t.issues || []).filter(i => i.level === 'error') : [];

function sortTasks(a, b) {
  if (sortMode === 'stalest') {
    const x = ageDays(a), y = ageDays(b);
    if (x !== y) return (y ?? -1) - (x ?? -1);
  }
  return (prioRank[a.priority] ?? 3) - (prioRank[b.priority] ?? 3)
      || (a.due || '9').localeCompare(b.due || '9');
}

function matches(t) {
  if (!query) return true;
  const hay = [t.title, t.body, ...t.fields.map(f => f[1])].join(' ').toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function cardHtml(t) {
  const place = ['area', 'epic'].filter(k => k !== laneBy).map(k => field(t, k)).filter(Boolean).join(' / ');
  const p = PRIO[t.priority];
  const age = ageDays(t);
  const stale = age !== null && isOpen(t) && age >= (data.stale_days || 7);
  const tags = [];
  for (const k of ['type', 'size', 'est'].filter(k => k !== laneBy)) { const v = field(t, k); if (v) tags.push(`<span class="tag" title="${k}">${esc(v)}</span>`); }
  if (t.due) {
    const d = t.due.slice(0, 10);
    tags.push(`<span class="tag ${isOpen(t) && d < new Date().toISOString().slice(0, 10) ? 'late' : ''}" title="due">⏰ ${d}</span>`);
  }
  if (t.conversation) tags.push(`<span class="tag" title="conversation ${esc(t.conversation)}">💬 ${esc(t.conversation.slice(0, 8))}</span>`);
  const errs = issuesOf(t);
  if (errs.length) tags.push(`<span class="tag warn" title="${esc(errs.map(i => i.msg).join('\n'))}">⚠ ${errs.length}</span>`);
  const why = t.column === 'blocked' ? field(t, 'blocked-by') : '';
  return `<div class="card ${isOpen(t) ? '' : 'done'}" draggable="true" data-id="${esc(t.id)}" style="--stage:${colVar(t.column)}">
    <div class="top">
      <span class="place" title="${esc(place)}">${esc(place)}</span>
      ${p ? `<span class="rt" style="--rt:var(${p.v})"><i></i>${p.label}</span>` : ''}
    </div>
    <div class="title">${esc(t.title)}</div>
    ${why ? `<div class="why">⛔ ${esc(why)}</div>` : ''}
    <div class="foot">
      ${tags.join('')}
      ${age !== null && isOpen(t) ? `<span class="age ${stale ? 'stale' : ''}" title="last edited ${esc(t.modified.slice(0, 10))}">⏱ ${age === 0 ? 'today' : age + 'd'}</span>` : ''}
    </div>
  </div>`;
}

// Finished work stacks (see board-common.css): the most recently finished task in front.
const finishedAt = t => Date.parse(t.completed_at || t.modified || 0) || 0;
const cellHtml = (list, col) => {
  const stack = col === 'done' && list.length > 1;
  if (stack) list = [...list].sort((a, b) => finishedAt(b) - finishedAt(a));
  return `<div class="cell ${stack ? 'stack' : ''}" data-col="${esc(col)}" ${stack ? `data-hint="+${list.length - 1} more · hover"` : ''}>
    ${list.length ? list.map(cardHtml).join('') : '<div class="empty">—</div>'}</div>`;
};

function render() {
  if (!data) return;
  const cols = data.columns;
  const visible = tasks.filter(matches);
  const count = c => visible.filter(t => t.column === c).length;
  const by = (list, c) => list.filter(t => t.column === c).sort(sortTasks);

  $('#strip').innerHTML = cols.map(c =>
    `<span class="pill"><i style="background:${colVar(c)}"></i>${label(c)} <b>${count(c)}</b></span>`).join('');
  const heads = `<div class="cols">${cols.map(c =>
    `<div class="colhead"><i style="background:${colVar(c)}"></i>${label(c)}<span class="n">${count(c)}</span>${
      // Not on Done: a task created there would be born completed.
      c === 'done' ? '' : `<button type="button" class="add" data-col="${esc(c)}" title="Add a task to ${esc(label(c))}" aria-label="Add a task to ${esc(label(c))}">+</button>`
    }</div>`).join('')}</div>`;

  let body;
  if (!laneBy) {
    body = `<div class="lane-cells">${cols.map(c => cellHtml(by(visible, c), c)).join('')}</div>`;
  } else {
    const lanes = new Map();
    for (const t of visible) {
      const v = field(t, laneBy) || '(none)';
      if (!lanes.has(v)) lanes.set(v, { key: v, cards: [] });
      lanes.get(v).cards.push(t);
    }
    const open = l => l.cards.filter(isOpen).length;
    const sorted = [...lanes.values()].sort((a, b) => open(b) - open(a) || b.cards.length - a.cards.length || a.key.localeCompare(b.key));
    body = sorted.map(l => {
      // Finished work isn't workload: the dots and the big number count what's still open, and
      // the total with the done ones follows in parentheses only when there are any.
      const mini = cols.filter(c => c !== 'done').map(c => {
        const n = l.cards.filter(t => t.column === c).length;
        return n ? `<span title="${label(c)}"><i style="background:${colVar(c)}"></i>${n}</span>` : '';
      }).join('');
      const o = open(l), all = l.cards.length, fin = all - o;
      const count = fin ? `${o} (${all})` : `${o}`;
      const tip = fin ? `${o} open · ${all} including ${fin} done` : `${o} open`;
      return `<section class="lane ${folded.has(l.key) ? 'folded' : ''}" data-lane="${esc(l.key)}">
        <div class="lane-head"><span class="caret">▾</span>${esc(l.key)}<span class="n" title="${tip}">${count}</span><span class="mini">${mini}</span></div>
        <div class="lane-cells">${cols.map(c => cellHtml(by(l.cards, c), c)).join('')}</div>
      </section>`;
    }).join('') || '<div style="padding:40px;text-align:center;color:var(--faint)">No tasks</div>';
  }

  const boardEl = $('#board');
  boardEl.className = 'board ' + (laneBy ? '' : 'no-lanes');
  boardEl.style.setProperty('--ncols', cols.length);
  const scroll = $('main').scrollTop;
  boardEl.innerHTML = heads + body;
  $('main').scrollTop = scroll;
  Board.syncStuck();

  renderLaneSeg();
  Board.segMark('#lanes', v => (v === 'none' ? '' : v) === laneBy);
  Board.segMark('#sorts', v => v === sortMode);
}

const pathProject = () => { const m = location.pathname.match(/^\/tasks\/([^/]+)/); return m ? decodeURIComponent(m[1]) : ''; };

async function load() {
  if (!project) {
    $('#board').innerHTML = '<div style="padding:60px;text-align:center;color:var(--faint)">No task boards yet.<br><br>Add <code>[projects.&lt;key&gt;.tasks]</code> with a <code>list = "…"</code> to <code>~/.hive/projects.toml</code>.</div>';
    return;
  }
  try {
    const text = await (await fetch('/api/tasks?project=' + encodeURIComponent(project))).text();
    const r = JSON.parse(text);
    if (r.error) { $('#offline').hidden = false; $('#offline').textContent = r.error; return; }
    $('#offline').hidden = true;
    if (text === lastJson || Board.dragging()) return;
    lastJson = text;
    const first = data === null;
    data = r; tasks = r.tasks;
    if (first) {
      const v = store.get('lanes:' + project, null);   // 'none' | a field; true/false from older builds
      laneBy = v === null ? (r.group_by ? defaultLane() : '')
        : v === true ? defaultLane()
        : v === false || v === 'none' ? ''
        : LANE_FIELDS.concat(defaultLane()).includes(String(v).toLowerCase()) ? String(v).toLowerCase() : defaultLane();
      folded = new Set(store.get(foldKey(), []));
    }
    render();
  } catch { $('#offline').hidden = false; $('#offline').textContent = 'offline'; }
}

async function moveTask(id, column, blockedBy) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.column = column; render(); }   // optimistic; the next poll confirms
  const res = await post('/api/task-move', { project, id, column, blocked_by: blockedBy });
  if (!res.ok) toast(res.error || 'Could not move task');
  lastJson = '';
  load();
}

// ---- blocked reason dialog ----
function askReason(t) {
  pendingBlock = t.id;
  $('#dialogFor').textContent = t.title;
  $('#reason').value = field(t, 'blocked-by');
  $('#scrim').classList.add('open');
  $('#reason').focus();
}
function closeDialog() { pendingBlock = null; $('#scrim').classList.remove('open'); }
$('#dialog').addEventListener('submit', e => {
  e.preventDefault();
  const id = pendingBlock, why = $('#reason').value.trim();
  closeDialog();
  if (id) moveTask(id, 'blocked', why);
});
$('#cancel').addEventListener('click', closeDialog);
$('#scrim').addEventListener('mousedown', e => { if (e.target.id === 'scrim') closeDialog(); });

// ---- add a task ----
// A title and the column it was opened from. The board's `filter` is stamped by the server,
// and a strict board's required fields (`data.required`) are asked for here; anything else
// (size, epic…) is set afterwards with `hive task set`. With lanes on, a card with no value for
// the lane field yet sits under "(none)", which the dialog says up front.
let addCol = '', adding = false;
function openAdd(col) {
  addCol = col;
  const req = (data && data.required) || [];
  $('#addFields').innerHTML = req.map(f => {
    const name = esc(f.name);
    return `<label>${name}` + (f.values && f.values.length
      ? `<select data-f="${name}" required><option value="">choose…</option>${f.values.map(v => `<option>${esc(v)}</option>`).join('')}</select>`
      : `<input data-f="${name}" required autocomplete="off" maxlength="200">`) + '</label>';
  }).join('');
  const asked = req.some(f => f.name.toLowerCase() === laneBy);
  $('#addFor').textContent = 'in ' + label(col) +
    (laneBy && !asked ? ` · no ${laneBy} yet, so it sits under (none) until you set one` : '');
  $('#addErr').hidden = true;
  $('#addTitle').value = '';
  $('#addScrim').classList.add('open');
  $('#addTitle').focus();
}
function closeAdd() { $('#addScrim').classList.remove('open'); }
// Failures stay in the dialog (the toast would sit under the overlay) so the title isn't lost.
function addFailed(msg) {
  if ($('#addScrim').classList.contains('open')) { $('#addErr').textContent = msg; $('#addErr').hidden = false; }
  else toast(msg);
}
$('#addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('#addTitle').value.trim();
  if (!title) { $('#addTitle').focus(); return; }
  if (adding) return;   // a double Enter must not create the reminder twice
  adding = true;
  const go = $('#addGo');
  go.disabled = true; go.textContent = 'Adding…';
  try {
    const fields = {};
    for (const el of $('#addFields').querySelectorAll('[data-f]')) fields[el.dataset.f] = el.value;
    const res = await post('/api/task-add', { project, title, column: addCol, fields });
    if (res.ok) { closeAdd(); toast('Added to ' + label(addCol)); lastJson = ''; load(); }
    else addFailed(res.error || 'Could not add task');
  } catch { addFailed('offline'); }
  finally { adding = false; go.disabled = false; go.textContent = 'Add'; }
});
$('#addCancel').addEventListener('click', closeAdd);
$('#addScrim').addEventListener('mousedown', e => { if (e.target.id === 'addScrim') closeAdd(); });

// ---- details ----
function showDetail(t) {
  const rows = [['column', label(t.column)], ['priority', t.priority], t.due ? ['due', t.due.slice(0, 10)] : null,
    t.modified ? ['last edited', t.modified.slice(0, 10) + ' (' + ageDays(t) + 'd ago)'] : null, ...t.fields].filter(Boolean);
  const errs = issuesOf(t);
  $('#detail').innerHTML = `<h2>${esc(t.title)}</h2>
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${errs.length ? `<div class="issues">⚠ ${errs.map(i => esc(i.msg)).join('<br>⚠ ')}</div>` : ''}
    ${t.body ? `<pre>${esc(t.body)}</pre>` : ''}
    <div class="row"><button type="button" id="detailClose">Close</button></div>`;
  $('#detailScrim').classList.add('open');
  $('#detailClose').onclick = () => $('#detailScrim').classList.remove('open');
}
$('#detailScrim').addEventListener('mousedown', e => { if (e.target.id === 'detailScrim') e.target.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDialog(); closeAdd(); $('#detailScrim').classList.remove('open'); } });

// ---- board: drag between columns (shared), fold lanes, open details ----
const board = $('#board');
Board.wireDnD(board, (id, cell) => {
  const col = cell.dataset.col;
  const t = tasks.find(t => t.id === id);
  if (!t || t.column === col) return;
  if (col === 'blocked') askReason(t); else moveTask(id, col);
});
board.addEventListener('click', e => {
  const add = e.target.closest('.colhead .add');
  if (add) { openAdd(add.dataset.col); return; }
  const lane = e.target.closest('.lane-head');
  if (lane) { Board.toggleLane(lane, folded, () => store.set(foldKey(), [...folded])); return; }
  const el = e.target.closest('.card');
  const t = el && tasks.find(t => t.id === el.dataset.id);
  if (t) showDetail(t);
});

// ---- toolbar ----
Board.seg('#lanes', v => {
  laneBy = v === 'none' ? '' : v;
  store.set('lanes:' + project, v);
  folded = new Set(store.get(foldKey(), []));
  render();
});
Board.seg('#sorts', v => { sortMode = v; store.set('sort', v); render(); });
$('#search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });

// ---- right-click menu (shared) ----
Board.menu.onClose = () => { menuTask = null; };
board.addEventListener('contextmenu', e => {
  const el = e.target.closest('.card');
  const t = el && tasks.find(t => t.id === el.dataset.id);
  if (!t) return;
  e.preventDefault();
  menuTask = t;
  Board.menu.open(`<div class="who">${esc(t.title)}</div>
    <button role="menuitem" data-act="detail"><span class="ic">ⓘ</span>Details</button>
    <hr><div class="sec">Move to</div>` +
    data.columns.map(c => `<button role="menuitem" data-act="move" data-col="${esc(c)}" class="${t.column === c ? 'cur' : ''}">
      <span class="dot" style="background:${colVar(c)}"></span>${label(c)}${t.column === c ? '<span class="check">✓</span>' : ''}</button>`).join(''),
    e.clientX, e.clientY);
});
Board.menu.el.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  const t = menuTask;
  if (!btn || !t) return;
  Board.menu.close();
  if (btn.dataset.act === 'detail') showDetail(t);
  else if (btn.dataset.col !== t.column) { if (btn.dataset.col === 'blocked') askReason(t); else moveTask(t.id, btn.dataset.col); }
});

(async () => {
  const boards = await Board.switcher();
  project = pathProject() || (boards[0] && boards[0].key) || '';
  Board.pick('/tasks/' + encodeURIComponent(project));
  await load();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
