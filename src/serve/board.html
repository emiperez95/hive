<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive Board</title>
<link rel="stylesheet" href="/board-common.css">
<style>
  /* Conversation-board only; the rest is in board-common.css. */
  .card.frozen { opacity: .78; }
  .card .title.untitled { color: var(--faint); font-style: italic; }
  .card .reason {
    font-size: 12px; color: var(--s-blocked); background: color-mix(in srgb, var(--s-blocked) 10%, transparent);
    border-radius: 4px; padding: 3px 6px; line-height: 1.35;
  }
  .card .note { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .card button.thaw {
    font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 4px; padding: 2px 8px;
  }
  .card button.thaw:hover { border-color: var(--accent); color: var(--accent); }
  .switch {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .switch[hidden] { display: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track {
    width: 30px; height: 18px; border-radius: 999px; background: var(--line);
    position: relative; transition: background .15s; flex-shrink: 0;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(12px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch input:checked ~ .lbl { color: var(--text); }
  /* ---- project filter ---- */
  .filters {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .filters .label { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12px; font-weight: 500; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); }
  .chip .n { color: var(--faint); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.on .n { color: rgba(255,255,255,.8); }
  .chip.all.on { background: var(--text); border-color: var(--text); color: var(--bg); }
  .chip.idle { opacity: .55; }
  .filters .hint { font-size: 11px; color: var(--faint); margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>🐝 hive <span>board</span></h1>
  <select class="board-sel" id="boardSel" title="Switch board"></select>
  <div class="strip" id="strip"></div>
  <span class="offline" id="offline" hidden>offline</span>
  <div class="spacer"></div>
  <input class="search" id="search" placeholder="Filter…" autocomplete="off">
  <div>
    <span class="seg-label">Lanes</span>
    <div class="seg" id="lanes">
      <button data-v="none">None</button>
      <button data-v="project">Project</button>
      <button data-v="env">Env</button>
    </div>
  </div>
</header>
<main>
  <nav class="filters" id="filters"></nav>
  <div class="board" id="board"></div>
</main>

<div class="scrim" id="scrim">
  <form class="dialog" id="dialog">
    <h2>Blocked on what?</h2>
    <p id="dialogFor"></p>
    <input id="reason" placeholder="e.g. waiting on staging creds" autocomplete="off">
    <label class="switch" id="freezeSwitch" title="Close the window and keep the conversation to thaw later — the reason becomes its freeze note">
      <input type="checkbox" id="freezeToggle"><span class="track"></span><span class="lbl">💤 Freeze the conversation until unblocked</span>
    </label>
    <div class="row">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Move to Blocked</button>
    </div>
  </form>
</div>
<div class="scrim" id="askScrim">
  <form class="dialog" id="ask">
    <h2 id="askTitle"></h2>
    <p id="askSub"></p>
    <input id="askInput" autocomplete="off">
    <div class="row">
      <button type="button" id="askCancel">Cancel</button>
      <button type="submit" class="primary" id="askOk"></button>
    </div>
  </form>
</div>
<div class="menu" id="menu" role="menu"></div>
<div class="toast" id="toast"></div>

<script src="/board-common.js"></script>
<script>
const STAGES = [
  { key: 'todo',        label: 'Todo' },
  { key: 'planning',    label: 'Planning' },
  { key: 'in_progress', label: 'In progress' },
  { key: 'blocked',     label: 'Blocked' },
  { key: 'done',        label: 'Done' },
];
const stageVar = k => `var(--s-${k || 'todo'})`;

const { $, esc, post, toast } = Board;
const store = Board.store('hiveBoard:');
// `?lanes=project|env|none` wins, so a lane view can be bookmarked.
let laneMode = new URLSearchParams(location.search).get('lanes') || store.get('lanes', 'none');
let folded = new Set(store.get('folded', []));
let cards = [];
let lastJson = '';
let query = '';
// Projects to show; empty = all. `?projects=a,b` wins, so a filtered view can be bookmarked.
const urlProjects = new URLSearchParams(location.search).get('projects');
let projectFilter = new Set(urlProjects != null ? urlProjects.split(',').filter(Boolean) : store.get('projects', []));


// What Claude is doing right now — separate from the stage you set.
function runtime(c) {
  if (c.kind === 'frozen') return { label: 'frozen', v: '--rt-off' };
  const st = c.status;
  if (c.attention === 0) return { label: 'needs you', v: '--rt-needs' };
  if (st && st.RunningWorkflow) return { label: 'flow', v: '--rt-flow' };
  if (st === 'Working') return { label: 'working', v: '--rt-working' };
  if (c.attention === 1) return { label: 'review', v: '--rt-idle' };
  return { label: 'idle', v: '--rt-idle' };
}

function ago(secs) {
  if (secs == null || secs < 0) return '';
  if (secs < 60) return 'now';
  if (secs < 3600) return Math.floor(secs / 60) + 'm';
  if (secs < 86400) return Math.floor(secs / 3600) + 'h';
  return Math.floor(secs / 86400) + 'd';
}
const since = iso => iso ? (Date.now() - Date.parse(iso)) / 1000 : null;

function placeLabel(c) {
  const p = c.parent || c.project_key || '';
  const [proj, ...rest] = p.split('/');
  const branch = rest.join('/');
  return `${c.emoji ? c.emoji + ' ' : ''}${proj || 'unassigned'}${branch ? ' / ' + branch : ''}`;
}

// A worktree's card belongs to its project. '' = unassigned.
const projectOf = c => c.project_key || (c.parent || '').split('/')[0] || '';

function laneOf(c) {
  if (laneMode === 'project') {
    const k = projectOf(c);
    return { key: 'p:' + k, label: (c.emoji ? c.emoji + ' ' : '') + (k || '(unassigned)') };
  }
  if (laneMode === 'env') {
    const p = c.auth_profile || 'default';
    return { key: 'e:' + p, label: p };
  }
  return { key: 'all', label: '' };
}

function matches(c) {
  if (projectFilter.size && !projectFilter.has(projectOf(c))) return false;
  if (!query) return true;
  const hay = [c.title, c.parent, c.project_key, c.auth_profile, c.note, c.stage_note, c.frozen_note, c.short_id]
    .filter(Boolean).join(' ').toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function cardHtml(c) {
  const rt = runtime(c);
  const stageAge = c.stage_at ? ago(since(c.stage_at)) : '';
  const tags = [];
  if (c.kind === 'frozen') tags.push('<span class="tag">💤 frozen</span>');
  if (c.kind === 'skipped') tags.push('<span class="tag">skipped</span>');
  if (c.auth_profile) tags.push(`<span class="tag">${esc(c.auth_profile)}</span>`);
  // A card frozen from the Blocked dialog carries `Blocked: <reason>` as its freeze
  // note — the same words as the reason line above it, so don't print them twice.
  const restates = n => c.stage === 'blocked' &&
    n.replace(/^Blocked:?\s*/i, '').trim() === (c.stage_note || '').trim();
  const note = [c.frozen_note, c.note].find(n => n && !restates(n));
  return `<div class="card ${c.kind === 'frozen' ? 'frozen' : ''}"
      draggable="true" data-id="${esc(c.id)}" style="--stage:${stageVar(c.stage)}">
    <div class="top">
      <span class="place" title="${esc(c.parent || '')}">${esc(placeLabel(c))}</span>
      <span class="rt ${c.unseen ? 'pulse' : ''}" style="--rt:var(${rt.v})"><i></i>${rt.label}</span>
    </div>
    <div class="title ${c.title ? '' : 'untitled'}">${esc(c.title || '(untitled)')}</div>
    ${c.stage === 'blocked' && c.stage_note ? `<div class="reason">⛔ ${esc(c.stage_note)}</div>` : ''}
    ${note ? `<div class="note">📝 ${esc(note)}</div>` : ''}
    <div class="foot">
      ${tags.join('')}
      <span class="mono">${esc(c.short_id)}</span>
      ${c.kind === 'frozen' ? '<button class="thaw" data-thaw>Thaw</button>' : ''}
      <span class="age" title="${c.stage_at ? 'in this column since ' + esc(c.stage_at) : ''}">${stageAge}</span>
    </div>
  </div>`;
}

// Finished work stacks (see board-common.css): the card moved to Done most recently in front.
function cellHtml(list, stageKey) {
  const stack = stageKey === 'done' && list.length > 1;
  if (stack) list = [...list].sort((a, b) => (Date.parse(b.stage_at || 0) || 0) - (Date.parse(a.stage_at || 0) || 0));
  return `<div class="cell ${stack ? 'stack' : ''}" data-stage="${stageKey ?? ''}" ${stack ? `data-hint="+${list.length - 1} more · hover"` : ''}>
    ${list.length ? list.map(c => cardHtml(c)).join('') : '<div class="empty">—</div>'}
  </div>`;
}

// One chip per project on the board, busiest first. Counts are over the whole
// board (not the filtered view), so an unselected chip still says what it holds.
// A selected project that has emptied out keeps its chip, or it couldn't be undone.
function renderFilters() {
  const projects = new Map();
  for (const c of cards) {
    const k = projectOf(c);
    if (!projects.has(k)) projects.set(k, { key: k, emoji: c.emoji, n: 0, open: 0 });
    const p = projects.get(k);
    p.n++;
    if (!p.emoji && c.emoji) p.emoji = c.emoji;
    if (c.kind !== 'frozen' && c.stage !== 'done') p.open++;
  }
  for (const k of projectFilter) if (!projects.has(k)) projects.set(k, { key: k, emoji: '', n: 0, open: 0 });
  const list = [...projects.values()].sort((a, b) =>
    b.open - a.open || b.n - a.n || (a.key || '~').localeCompare(b.key || '~'));
  const chips = list.map(p =>
    `<button class="chip ${projectFilter.has(p.key) ? 'on' : ''} ${p.open ? '' : 'idle'}" data-project="${esc(p.key)}"
       title="${p.open} active · ${p.n} total">${p.emoji ? esc(p.emoji) + ' ' : ''}${esc(p.key || '(unassigned)')}<span class="n">${p.n}</span></button>`
  ).join('');
  document.getElementById('filters').innerHTML =
    `<span class="label">Projects</span>
     <button class="chip all ${projectFilter.size ? '' : 'on'}" data-project-all>All<span class="n">${cards.length}</span></button>
     ${chips}
     <span class="hint">click to filter · click more to add · ⌘-click for just one</span>`;
}

function render() {
  renderFilters();
  const visible = cards.filter(matches);
  const byStage = k => visible.filter(c => (c.stage ?? null) === k);

  document.getElementById('strip').innerHTML = STAGES.map(s =>
    `<span class="pill"><i style="background:${stageVar(s.key)}"></i>${s.label} <b>${byStage(s.key).length}</b></span>`
  ).join('');

  const heads = `<div class="cols">${STAGES.map(s =>
    `<div class="colhead"><i style="background:${stageVar(s.key)}"></i>${s.label}<span class="n">${byStage(s.key).length}</span></div>`
  ).join('')}</div>`;

  let body;
  if (laneMode === 'none') {
    body = `<div class="lane-cells">${STAGES.map(s => cellHtml(byStage(s.key), s.key)).join('')}</div>`;
  } else {
    const lanes = new Map();
    for (const c of visible) {
      const l = laneOf(c);
      if (!lanes.has(l.key)) lanes.set(l.key, { ...l, cards: [] });
      lanes.get(l.key).cards.push(c);
    }
    // Lanes with open work first, then by size, then by name.
    const open = l => l.cards.filter(c => c.stage !== 'done').length;
    const sorted = [...lanes.values()].sort((a, b) =>
      open(b) - open(a) || b.cards.length - a.cards.length || a.label.localeCompare(b.label));
    body = sorted.map(l => {
      // Per-stage counts, only the non-empty ones — readable even when folded.
      const mini = STAGES.map(s => {
        const n = l.cards.filter(c => (c.stage ?? null) === s.key).length;
        return n ? `<span title="${s.label}"><i style="background:${stageVar(s.key)}"></i>${n}</span>` : '';
      }).join('');
      return `<section class="lane ${folded.has(l.key) ? 'folded' : ''}" data-lane="${esc(l.key)}">
        <div class="lane-head"><span class="caret">▾</span>${esc(l.label)}<span class="n">${l.cards.length}</span><span class="mini">${mini}</span></div>
        <div class="lane-cells">${STAGES.map(s =>
          cellHtml(l.cards.filter(c => (c.stage ?? null) === s.key), s.key)).join('')}</div>
      </section>`;
    }).join('') || '<div class="empty" style="padding:40px;text-align:center;color:var(--faint)">No conversations</div>';
  }

  const board = document.getElementById('board');
  board.className = 'board ' + (laneMode === 'none' ? 'no-lanes' : '');
  const scroll = document.querySelector('main').scrollTop;
  board.innerHTML = heads + body;
  document.querySelector('main').scrollTop = scroll;
  syncStuck();

  Board.segMark('#lanes', v => v === laneMode);
}

async function load() {
  try {
    const r = await fetch('/api/board');
    const text = await r.text();
    document.getElementById('offline').hidden = true;
    if (text === lastJson || Board.dragging()) return;
    lastJson = text;
    cards = JSON.parse(text);
    render();
  } catch {
    document.getElementById('offline').hidden = false;
  }
}

async function setStage(id, stage, note) {
  // Optimistic: move it now, the next poll confirms.
  const c = cards.find(c => c.id === id);
  if (c) {
    c.stage = stage || undefined;
    c.stage_at = stage ? new Date().toISOString() : undefined;
    c.stage_note = stage === 'blocked' ? note : undefined;
    render();
  }
  const res = await post('/api/stage', { id, stage, note });
  if (!res.ok) toast(res.error || 'Could not move card');
  lastJson = '';
  load();
}

// ---- blocked reason dialog ----
let pendingBlock = null;
function askReason(c) {
  pendingBlock = c.id;
  document.getElementById('dialogFor').textContent = c.title || c.short_id;
  const input = document.getElementById('reason');
  input.value = c.stage_note || '';
  // Only a running window can be frozen; a frozen card already is.
  const canFreeze = !!c.placement && c.kind !== 'frozen';
  document.getElementById('freezeSwitch').hidden = !canFreeze;
  document.getElementById('freezeToggle').checked = canFreeze && store.get('freezeOnBlock', false);
  updateSubmit();
  document.getElementById('scrim').classList.add('open');
  input.focus();
}
function closeDialog() { pendingBlock = null; document.getElementById('scrim').classList.remove('open'); }
function updateSubmit() {
  const freeze = document.getElementById('freezeToggle').checked;
  document.querySelector('#dialog button.primary').textContent = freeze ? 'Block & freeze' : 'Move to Blocked';
}
document.getElementById('freezeToggle').addEventListener('change', e => {
  store.set('freezeOnBlock', e.target.checked);
  updateSubmit();
});
document.getElementById('dialog').addEventListener('submit', async e => {
  e.preventDefault();
  const id = pendingBlock;
  const note = document.getElementById('reason').value.trim();
  const freeze = !document.getElementById('freezeSwitch').hidden && document.getElementById('freezeToggle').checked;
  closeDialog();
  if (!id) return;
  const c = cards.find(c => c.id === id);
  // Stage first: the overlay is keyed by conversation id, so the card stays in
  // Blocked when it comes back as a frozen card.
  await setStage(id, 'blocked', note);
  if (freeze && c && c.placement) await freezeCard(c, note);
});

async function freezeCard(c, note, raw = false) {
  const p = c.placement;
  const res = await post('/api/freeze', {
    session: p.session_name,
    window_index: p.window_index,
    window_name: p.window_name,
    cwd: c.cwd || '',
    session_id: c.id,
    note: raw ? note : (note ? 'Blocked: ' + note : 'Blocked'),
  });
  toast(res.ok ? '💤 Frozen — thaw it from the card when unblocked' : (res.error || 'Freeze failed'));
  lastJson = '';
  setTimeout(load, 600);
}
document.getElementById('cancel').addEventListener('click', closeDialog);
document.getElementById('scrim').addEventListener('mousedown', e => { if (e.target.id === 'scrim') closeDialog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });

// ---- drag & drop (shared) ----
const board = document.getElementById('board');
Board.wireDnD(board, (id, cell) => {
  const stage = cell.dataset.stage || null;
  const c = cards.find(c => c.id === id);
  if (!c || (c.stage ?? null) === stage) return;
  if (stage === 'blocked') askReason(c);
  else setStage(id, stage);
});

// ---- click: switch to the window, or thaw ----
board.addEventListener('click', async e => {
  const lane = e.target.closest('.lane-head');
  if (lane) {
    Board.toggleLane(lane, folded, () => store.set('folded', [...folded]));
    return;
  }
  const el = e.target.closest('.card');
  if (!el) return;
  const c = cards.find(c => c.id === el.dataset.id);
  if (!c) return;
  if (e.target.closest('[data-thaw]')) {
    toast('Thawing…');
    const res = await post('/api/thaw', { key: c.id });
    toast(res.ok ? `Thawed into ${res.session}` : (res.error || 'Thaw failed'));
    lastJson = '';
    setTimeout(load, 800);
    return;
  }
  if (!c.placement) { if (c.kind === 'frozen') toast('Frozen — use Thaw to reopen it'); return; }
  const res = await post('/api/switch', { session: c.placement.session_name, window_index: c.placement.window_index });
  toast(res.ok ? `Switched to ${c.placement.session_name}` : (res.error || 'Switch failed'));
});

Board.seg('#lanes', v => { laneMode = v; store.set('lanes', v); render(); });
document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  if (chip.hasAttribute('data-project-all')) {
    projectFilter.clear();
  } else {
    const k = chip.dataset.project;
    // Plain click toggles (so several can be picked); ⌘-click (or ⌥/Ctrl) shows only that one.
    if (e.metaKey || e.ctrlKey || e.altKey) projectFilter = new Set([k]);
    else projectFilter.has(k) ? projectFilter.delete(k) : projectFilter.add(k);
  }
  store.set('projects', [...projectFilter]);
  // Keep the URL in step so the view can be bookmarked or shared as-is.
  const url = new URL(location.href);
  if (projectFilter.size) url.searchParams.set('projects', [...projectFilter].join(','));
  else url.searchParams.delete('projects');
  history.replaceState(null, '', url);
  render();
});
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

// ---- right-click menu ----
// A small in-page dialog for a note or a confirmation (no input). Resolves to the
// text, or null when cancelled.
function ask({ title, sub = '', placeholder = '', value = '', ok, danger = false, input = true }) {
  return new Promise(resolve => {
    const scrim = document.getElementById('askScrim');
    const field = document.getElementById('askInput');
    document.getElementById('askTitle').textContent = title;
    document.getElementById('askSub').textContent = sub;
    const okBtn = document.getElementById('askOk');
    okBtn.textContent = ok;
    okBtn.classList.toggle('calm', !danger);
    field.hidden = !input;
    field.placeholder = placeholder;
    field.value = value;
    const done = v => {
      scrim.classList.remove('open');
      form.removeEventListener('submit', onSubmit);
      cancel.removeEventListener('click', onCancel);
      scrim.removeEventListener('mousedown', onScrim);
      document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const form = document.getElementById('ask');
    const cancel = document.getElementById('askCancel');
    const onSubmit = e => { e.preventDefault(); done(field.value.trim()); };
    const onCancel = () => done(null);
    const onScrim = e => { if (e.target === scrim) done(null); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    form.addEventListener('submit', onSubmit);
    cancel.addEventListener('click', onCancel);
    scrim.addEventListener('mousedown', onScrim);
    document.addEventListener('keydown', onKey);
    scrim.classList.add('open');
    (input ? field : okBtn).focus();
  });
}

const menu = Board.menu;
let menuCard = null;
menu.onClose = () => { menuCard = null; };
function closeMenu() { menu.close(); }

function openMenu(c, x, y) {
  menuCard = c;
  const live = c.kind !== 'frozen' && !!c.placement;
  const cur = c.stage ?? null;
  const item = (act, ic, label, extra = '') =>
    `<button role="menuitem" data-act="${act}" ${extra}><span class="ic">${ic}</span>${label}</button>`;
  const parts = [`<div class="who">${esc(c.title || c.short_id)}</div>`];
  if (live) parts.push(item('open', '↗', 'Open'));
  else parts.push(item('thaw', '▶', 'Resume (thaw)'));
  parts.push('<hr><div class="sec">Move to</div>');
  for (const s of STAGES) {
    parts.push(`<button role="menuitem" data-act="stage" data-stage="${s.key ?? ''}" class="${cur === s.key ? 'cur' : ''}">
      <span class="dot" style="background:${stageVar(s.key)}"></span>${s.label}${cur === s.key ? '<span class="check">✓</span>' : ''}</button>`);
  }
  parts.push('<hr>');
  if (live) {
    parts.push(item('freeze', '💤', 'Freeze…'));
    parts.push(item('skip', c.kind === 'skipped' ? '↩' : '⏭', c.kind === 'skipped' ? 'Unskip session' : 'Skip session'));
    parts.push('<hr>');
    parts.push(item('close', '✕', 'Close window…', 'class="danger"'));
  } else {
    parts.push(item('discard', '🗑', 'Discard…', 'class="danger"'));
  }
  menu.open(parts.join(''), x, y);
}

board.addEventListener('contextmenu', e => {
  const el = e.target.closest('.card');
  if (!el) return;
  const c = cards.find(c => c.id === el.dataset.id);
  if (!c) return;
  e.preventDefault();
  openMenu(c, e.clientX, e.clientY);
});
menu.el.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  const c = menuCard;
  if (!btn || !c) return;
  closeMenu();
  const label = c.title || c.short_id;
  const refresh = () => { lastJson = ''; setTimeout(load, 600); };
  switch (btn.dataset.act) {
    case 'open': {
      const res = await post('/api/switch', { session: c.placement.session_name, window_index: c.placement.window_index });
      toast(res.ok ? `Switched to ${c.placement.session_name}` : (res.error || 'Switch failed'));
      break;
    }
    case 'thaw': {
      toast('Thawing…');
      const res = await post('/api/thaw', { key: c.id });
      toast(res.ok ? `Thawed into ${res.session}` : (res.error || 'Thaw failed'));
      refresh();
      break;
    }
    case 'stage': {
      const stage = btn.dataset.stage || null;
      if ((c.stage ?? null) === stage) break;
      if (stage === 'blocked') askReason(c);
      else setStage(c.id, stage);
      break;
    }
    case 'freeze': {
      const note = await ask({ title: 'Freeze this conversation?', sub: label,
        placeholder: 'Why are you parking it? (optional)', value: c.stage === 'blocked' && c.stage_note ? 'Blocked: ' + c.stage_note : '',
        ok: '💤 Freeze' });
      if (note == null) break;
      await freezeCard(c, note, true);
      break;
    }
    case 'skip': {
      const res = await post('/api/toggle-flag', { session: c.placement.session_name, flag: 'skip' });
      toast(res.ok ? `${res.value ? 'Skipped' : 'Unskipped'} ${c.placement.session_name}` : (res.error || 'Failed'));
      refresh();
      break;
    }
    case 'close': {
      const ok = await ask({ title: 'Close this window?', input: false, danger: true, ok: 'Close window',
        sub: `${label} — the Claude process stops and the card leaves the board. Its history stays on disk and it can be resumed from the TUI.` });
      if (ok == null) break;
      const res = await post('/api/close-window', { id: c.id });
      toast(res.ok ? 'Window closed' : (res.error || 'Close failed'));
      refresh();
      break;
    }
    case 'discard': {
      const ok = await ask({ title: 'Discard this frozen conversation?', input: false, danger: true, ok: 'Discard',
        sub: `${label} — it leaves the board and the 💤 list. Its history stays on disk.` });
      if (ok == null) break;
      const res = await post('/api/discard-frozen', { key: c.id });
      toast(res.ok ? 'Discarded' : (res.error || 'Discard failed'));
      refresh();
      break;
    }
  }
});

// A hairline under the pinned column names once the board has scrolled under them.
const syncStuck = () => Board.syncStuck(() => document.getElementById('filters').offsetHeight);
document.querySelector('main').addEventListener('scroll', syncStuck, { passive: true });

load();
setInterval(load, 2000);

Board.switcher().then(() => Board.pick('/board'));
</script>
